      t.appendChild(icone(m[1]));
      t.appendChild(el("span", "", escapar(m[0])));
      c.appendChild(t);
      c.appendChild(el("b", "", String(m[2])));
      c.appendChild(el("em", "", escapar(m[3])));
      metricas.appendChild(c);
    });
    tela.appendChild(metricas);

    var cabeca3 = el("div", "cabeca-secao");
    cabeca3.appendChild(el("h2", "", "Conquistas recentes"));
    tela.appendChild(cabeca3);

    var conquistas = p.conquistas || [];
    if (conquistas.length){
      var pilha = el("div", "pilha");
      conquistas.forEach(function(c){
        var linha = el("div", "linha");
        var esq = el("span", "");
        esq.style.display = "flex";
        esq.style.alignItems = "center";
        esq.style.gap = "10px";
        var tick = el("span", "tick");
        tick.style.cssText = "width:22px;height:22px;border-radius:50%;display:grid;" +
          "place-items:center;background:var(--verde-fundo);color:var(--verde);flex:none";
        tick.appendChild(icone("i-check"));
        esq.appendChild(tick);
        esq.appendChild(el("span", "", escapar(nomeConquista(c.nome))));
        linha.appendChild(esq);
        if (c.vezes > 1) linha.appendChild(el("span", "medida", c.vezes + "x"));
        pilha.appendChild(linha);
      });
      tela.appendChild(pilha);
    } else {
      tela.appendChild(vazio("Nenhuma conquista ainda.",
        "Registre o almoço de hoje para começar.", "i-trofeu"));
    }

    tela.appendChild(atalho({id:"meu_dia", busca:"Meu dia", nome:"Ver meu histórico", icone:"i-prancheta"}));
    tela.appendChild(el("p", "legenda", "Seu progresso é só seu. Sem rankings ou comparações."));

    if (estado.pontosAnimar != null){
      contarAte(valor, estado.pontosAnimar, estado.pontos);
      estado.pontosAnimar = null;
    }
  }

  function serieProgresso(periodo){
    if(periodo === "semana") return meuHistorico().semana;
    var dia=(DADOS && DADOS.dia) || "", hoje=new Date(dia + "T12:00:00Z");
    if(!isFinite(hoje.getTime())) return [];
    var dias=meuHistorico().meu_dia.dias;
    var mensal=periodo === "mes", numero=mensal ? 5 : 12, partes=[];
    for(var n=0;n<numero;n++){
      var inicio, fim;
      if(mensal){
        inicio=new Date(hoje);inicio.setUTCDate(inicio.getUTCDate()-29+n*6);
        fim=new Date(inicio);fim.setUTCDate(fim.getUTCDate()+6);
      }else{
        inicio=new Date(Date.UTC(hoje.getUTCFullYear(),hoje.getUTCMonth()-11+n,1,12));
        fim=new Date(Date.UTC(inicio.getUTCFullYear(),inicio.getUTCMonth()+1,1,12));
      }
      var a=inicio.toISOString().slice(0,10),b=fim.toISOString().slice(0,10);
      var achados=dias.filter(function(d){return d.data >= a && d.data < b && d.data <= dia;});
      partes.push({sigla:mensal ? String(inicio.getUTCDate()).padStart(2,"0") : ["J","F","M","A","M","J","J","A","S","O","N","D"][inicio.getUTCMonth()],
        hoje:n===numero-1,registrado:achados.length > 0,kcal:achados.reduce(function(s,d){return s+(d.kcal || 0);},0)});
    }
    return partes;
  }

  // ---------- onde as coisas ficam guardadas ----------
  //
  // Num quadro embutido — e e assim que a previa chega para quem so recebeu o
  // link — o navegador bloqueia o `localStorage` do endereco de dentro. Sem
  // alternativa, o cadastro morreria no ultimo passo, e com uma mensagem sobre
  // espaco em disco que nem e o motivo.
  //
  // Entao ha dois lugares: o aparelho, quando da, e a memoria da aba, quando
  // nao da. O app funciona nos dois. O que muda e o que ele pode prometer — e
  // ele diz qual dos dois esta valendo, em vez de deixar a pessoa descobrir ao
  // fechar a pagina.
  var naMemoria = {};

  function guardar(chave, valor){
    try { localStorage.setItem(chave, valor); return "aparelho"; }
    catch (e) { naMemoria[chave] = valor; return "memoria"; }
  }
  function lido(chave){
    try {
      var v = localStorage.getItem(chave);
      if (v != null) return v;
    } catch (e) {}
    return naMemoria[chave] != null ? naMemoria[chave] : null;
  }
  function esquecer(chave){
    delete naMemoria[chave];
    try { localStorage.removeItem(chave); } catch (e) {}
  }
  // Uma escrita de teste responde o que `typeof localStorage` nao responde: no
  // quadro embutido o objeto existe e so o uso e que falha.
  function guardaNoAparelho(){
    try {
      localStorage.setItem("apetit-teste", "1");
      localStorage.removeItem("apetit-teste");
      return true;
    } catch (e) { return false; }
  }

  // ---------- cadastro ----------
  //
  // Na primeira vez o funcionario se cadastra do zero; depois o cadastro fica
  // guardado e ele edita quando quiser. Os passos e a ordem sao os mesmos do
  // bot (`ask_name` ate `ask_consent` em `bot.py`), para as duas portas de
  // entrada pedirem a mesma coisa, na mesma sequencia, com as mesmas palavras
  // no termo.
  //
  // Fica em `localStorage`, como a foto: esta demonstracao nao tem servidor, e
  // inventar um "salvo na nuvem" seria prometer o que nao existe. No app de
  // verdade quem guarda e o banco do bot, com o mesmo `Employee`.
  var CADASTRO = "apetit-cadastro";

  function cadastroSalvo(){
    try { return JSON.parse(lido(CADASTRO) || "null"); } catch (e) { return null; }
  }
  function guardarCadastro(dados){
    return guardar(CADASTRO, JSON.stringify(dados));
  }

  // O cadastro guardado manda no que as telas mostram. Sem ele, vale o exemplo
  // exportado do dominio, que e como a demonstracao nasce para quem so quer ver.
  function pessoa(){
    var salvo = cadastroSalvo();
    var exemplo = (DADOS && DADOS.perfil) || {};
    if (!salvo) return exemplo;
    return {
      nome: salvo.nome,
      iniciais: iniciaisDe(salvo.nome),
      refeitorio: salvo.refeitorio,
      empresa: salvo.empresa,
      setor: salvo.setor,
      objetivo: salvo.objetivo,
      alvo: alvoDoObjetivo(salvo.objetivo),
      restricoes: nomesDasRestricoes(salvo.restricoes),
      restricoes_codigos: salvo.restricoes || [],
      restricoes_livres: [],
      evitar: [],
      favoritos: [],
      // Preferencia de aviso e ajuste com padrao, nao historico: nasce igual
      // para todo mundo e a pessoa mexe se quiser.
      avisos: exemplo.avisos || []
    };
  }

  // Quem se cadastra comeca do zero. O histórico — pontos, conquistas, dias
  // registrados, favoritos — e da Mariana, e mostrá-lo para outra pessoa daria
  // a ela refeicoes que nunca fez e pontos que nunca ganhou. E o app ficaria
  // dizendo, na tela de privacidade, que guarda sobre ela o que e de outro.
  function meuHistorico(){
    var novo = !!cadastroSalvo();
    var base = novo ? {pontos:0, conquistas:[]} : ((DADOS && DADOS.progresso) || {pontos:0, conquistas:[]});
    var progresso = JSON.parse(JSON.stringify(base));
    var dias = novo ? [] : (((DADOS || {}).meu_dia || {}).dias || []).slice();
    if (estado.registro){
      var r = estado.registro;
      dias = dias.filter(function(d){ return d.data !== r.refeicao.data; }).concat([r.refeicao]);
      progresso.pontos = r.resultado.pontos_depois;
      (r.resultado.conquistas || []).forEach(function(c){
        var existente = progresso.conquistas.find(function(a){ return a.nome === c.nome; });
        if (existente) existente.vezes++;
        else progresso.conquistas.push({nome:c.nome, vezes:1});
      });
    }
    dias.sort(function(a,b){ return b.data.localeCompare(a.data); });
    progresso.resumo_semana = dias.length ? dias.length + (dias.length === 1 ? " dia com refeição registrada." : " dias com refeições registradas.") : "Registre o almoço para acompanhar seu progresso.";
    var semana = [], cursor = new Date(((DADOS || {}).dia || "") + "T12:00:00Z");
    while (isFinite(cursor.getTime()) && semana.length < 5){
      if (cursor.getUTCDay() !== 0 && cursor.getUTCDay() !== 6){
        var data = cursor.toISOString().slice(0,10);
        var refeicao = dias.find(function(d){ return d.data === data; });
        semana.unshift({data:data, sigla:["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][cursor.getUTCDay()],
          hoje:data === DADOS.dia, registrado:!!refeicao, kcal:refeicao ? refeicao.kcal : null});
      }
      cursor.setUTCDate(cursor.getUTCDate()-1);
    }
    return {progresso:progresso, meu_dia:{dias:dias}, semana:semana,
      favoritos:novo ? [] : (((DADOS || {}).perfil || {}).favoritos || [])};
  }

  // O que muda quando a pessoa deixa de ser o exemplo, ou volta a ser.
  function zerarSessao(){
    estado.nota = null;
    estado.faltas = [];
    estado.avaliado = false;
    estado.registrado = false;
    estado.registro = null;
    estado.montagem = [];
    estado.passoMontagem = 0;
    estado.conquistaNova = null;
    estado.pontosAnimar = null;
    estado.pontos = meuHistorico().progresso.pontos;
  }

  function restricoesAtuais(){
    var salvo = cadastroSalvo();
    if (salvo) return salvo.restricoes || [];
    return (DADOS && DADOS.perfil && DADOS.perfil.restricoes_codigos) || [];
  }

  function iniciaisDe(nome){
    return String(nome || "").trim().split(/\s+/).slice(0, 2)
      .map(function(p){ return p.charAt(0); }).join("").toUpperCase() || "?";
  }
  function alvoDoObjetivo(objetivo){
    var achado = ((DADOS && DADOS.objetivos) || []).filter(function(o){ return o.nome === objetivo; })[0];
    return achado ? achado.alvo : {};
  }
  function nomesDasRestricoes(codigos){
    var nomes = {};
    ((DADOS && DADOS.alergenicos) || []).forEach(function(a){ nomes[a.codigo] = a.nome; });
    return (codigos || []).map(function(c){ return nomes[c] || c; });
  }

  // rascunho do cadastro em andamento
  var rascunho = null;
  var passoAtual = 0;
  var campoEdicao = null;
  var ROTULOS_CADASTRO = {nome:"Nome", refeitorio:"Refeitório", empresa:"Empresa", setor:"Setor", objetivo:"Objetivo", restricoes:"Restrições"};

  var PASSOS = [
    { campo: "nome",       titulo: "Como você quer ser chamado?",
      apoio: "É esse nome que vai aparecer no seu app. Não precisa ser o nome completo.",
      tipo: "texto", rotulo: "Nome", exemplo: "Mariana" },
    { campo: "refeitorio", titulo: "Onde você almoça?",
      apoio: "A unidade da Apetit que serve o seu refeitório.",
      tipo: "texto", rotulo: "Refeitório", exemplo: "SM" },
    { campo: "empresa",    titulo: "Onde você trabalha?",
      apoio: "A empresa e o setor. Isso ajuda a Apetit a ver a adesão por setor — nunca o que você come.",
      tipo: "dupla", segundo: "setor",
      rotulo: "Empresa", exemplo: "Indústria Exemplo",
      rotulo2: "Setor", exemplo2: "Produção" },
    { campo: "objetivo",   titulo: "O que você quer do app?",
      apoio: "Isso só ajusta as dicas que eu te dou. Dá para mudar quando quiser.",
      tipo: "objetivo" },
    { campo: "restricoes", titulo: "Você tem alguma alergia ou intolerância?",
      apoio: "Marque o que se aplica. Eu aviso no cardápio o que você não pode comer — e nunca afirmo que um prato é seguro sem alguém ter conferido.",
      tipo: "alergias" },
    { campo: "consentimento", titulo: "Antes de terminar",
      apoio: "", tipo: "termo" }
  ];

  function novoRascunho(editando){
    var salvo = cadastroSalvo();
    if (editando && salvo){
      return { nome: salvo.nome, refeitorio: salvo.refeitorio, empresa: salvo.empresa,
               setor: salvo.setor, objetivo: salvo.objetivo,
               restricoes: (salvo.restricoes || []).slice(), consentimento: true, editando: true };
    }
    return { nome: "", refeitorio: "", empresa: "", setor: "", objetivo: "",
             restricoes: [], consentimento: false, editando: false };
  }

  function comecarCadastro(editando, campo){
    rascunho = novoRascunho(editando);
    campoEdicao = editando && cadastroSalvo() && Object.prototype.hasOwnProperty.call(ROTULOS_CADASTRO, campo) ? campo : null;
    passoAtual = campoEdicao ? PASSOS.findIndex(function(p){ return p.campo === campoEdicao || p.segundo === campoEdicao; }) : 0;
    historico.length = 0;
    mostrar("cadastro", false);
  }

  function passoDoCadastro(){
    var passo = PASSOS[passoAtual];
    if (campoEdicao && passo.tipo === "dupla"){
      return Object.assign({}, passo, {tipo:"texto", campo:campoEdicao,
        titulo:"Editar " + ROTULOS_CADASTRO[campoEdicao].toLowerCase(),
        rotulo:ROTULOS_CADASTRO[campoEdicao], exemplo:campoEdicao === passo.segundo ? passo.exemplo2 : passo.exemplo});
    }
    return passo;
  }

  function cancelarEdicaoDireta(){
    campoEdicao = null;
    rascunho = null;
    mostrar("perfil", false);
  }

  function passoCompleto(){
    var p = passoDoCadastro();
    if (p.tipo === "texto") return !!String(rascunho[p.campo] || "").trim();
    if (p.tipo === "dupla"){
      return !!String(rascunho[p.campo] || "").trim() && !!String(rascunho[p.segundo] || "").trim();
    }
    if (p.tipo === "objetivo") return !!rascunho.objetivo;
    if (p.tipo === "alergias") return true;      // "nenhuma" e uma resposta valida
    return rascunho.consentimento;
  }

  // Botao de escolha unica ou multipla, com a mesma caixa de marcar que as
  // opcoes do bot ja usam.
  function escolha(titulo, detalhe, marcada, aoClicar){
    var b = el("button", "opcao" + (marcada ? " marcada" : ""));
    b.setAttribute("aria-pressed", marcada ? "true" : "false");
    var txt = el("div", "txt");
    txt.appendChild(el("b", "", escapar(titulo)));
    if (detalhe) txt.appendChild(el("span", "", escapar(detalhe)));
    b.appendChild(txt);
    var marca = el("span", "caixa");
    marca.appendChild(icone("i-liberado"));
    b.appendChild(marca);
    b.addEventListener("click", aoClicar);
    return b;
  }

  function telaCadastro(){
    if (!rascunho){ rascunho = novoRascunho(!!cadastroSalvo()); passoAtual = 0; }
    var p = passoDoCadastro();

    topo.className = "topo simples";
    topo.textContent = "";
    var barra = el("div", "barra");
    barra.appendChild(botaoIcone("i-voltar", "Voltar", function(){
      if (campoEdicao){ cancelarEdicaoDireta(); return; }
      if (passoAtual > 0){ passoAtual--; redesenhar(); return; }
      var voltarPara = rascunho.editando ? "perfil" : "boas_vindas";
      rascunho = null;
      mostrar(voltarPara, false);
    }));
    var titulo = el("div", "titulo");
    titulo.appendChild(el("h1", "", campoEdicao ? "Editar " + ROTULOS_CADASTRO[campoEdicao].toLowerCase() : (rascunho.editando ? "Editar cadastro" : "Seu cadastro")));
    titulo.appendChild(el("p", "", campoEdicao ? "Salve quando terminar" : "Passo " + (passoAtual + 1) + " de " + PASSOS.length));
    barra.appendChild(titulo);
    topo.appendChild(barra);

    var trilho = el("div", "progresso-cadastro");
    var feito = el("div", "feito");
    feito.style.width = ((passoAtual + 1) / PASSOS.length * 100) + "%";
    trilho.appendChild(feito);
    if (!campoEdicao) tela.appendChild(trilho);

    tela.appendChild(el("h1", "h1", escapar(p.titulo)));
    if (p.apoio) tela.appendChild(el("p", "sub", escapar(p.apoio)));

    if (p.tipo === "texto" || p.tipo === "dupla"){
      tela.appendChild(campoTexto(p.campo, p.rotulo, p.exemplo));
      if (p.tipo === "dupla") tela.appendChild(campoTexto(p.segundo, p.rotulo2, p.exemplo2));
    } else if (p.tipo === "objetivo"){
      var lista = el("div", "pilha");
      lista.style.marginTop = "18px";
      ((DADOS && DADOS.objetivos) || []).forEach(function(o){
        lista.appendChild(escolha(
          o.nome,
          "Alvo do almoço: " + o.alvo.kcal + " kcal · " + o.alvo.ptn + " g de proteína",
          rascunho.objetivo === o.nome,
          function(){ rascunho.objetivo = o.nome; redesenhar(); }
        ));
      });
      tela.appendChild(lista);
      tela.appendChild(el("p", "legenda",
        "Alvo ilustrativo. Quem define quantidade individual é o nutricionista responsável — " +
        "se você mandar a sua ficha, o app passa a seguir ela."));
    } else if (p.tipo === "alergias"){
      var caixa = el("div", "pilha");
      caixa.style.marginTop = "18px";
      ((DADOS && DADOS.alergenicos) || []).forEach(function(a){
        var ligada = rascunho.restricoes.indexOf(a.codigo) >= 0;
        caixa.appendChild(escolha(a.nome, "", ligada, function(){
          var n = rascunho.restricoes.indexOf(a.codigo);
          if (n >= 0) rascunho.restricoes.splice(n, 1); else rascunho.restricoes.push(a.codigo);
          redesenhar();
        }));
      });
      tela.appendChild(caixa);
      tela.appendChild(el("p", "legenda", rascunho.restricoes.length
        ? "Se a sua restrição não está na lista, fale no balcão: eu só consigo conferir o que a " +
          "ficha técnica do prato declara."
        : "Você pode seguir sem marcar nada."));
    } else {
      var termo = el("div", "cartao");
      termo.style.marginTop = "18px";
      termo.appendChild(el("p", "paragrafo",
        "Preciso guardar seu nome, onde você almoça, empresa, setor, suas restrições e o que " +
        "você registrar que comeu."));
      termo.appendChild(el("p", "paragrafo",
        "<b>Sua empresa não vê nada disso sobre você.</b> Nem o que você come, nem o seu " +
        "objetivo, nem as suas restrições. A Apetit só enxerga quantas pessoas usam, por setor, " +
        "e mesmo assim setor com menos de 5 pessoas nem aparece."));
      termo.appendChild(el("p", "legenda",
        "Você vê tudo e apaga tudo quando quiser, no seu cadastro."));
      tela.appendChild(termo);

      var aceite = escolha("Li e concordo",
        "Sem isso o app não guarda nada — e também não funciona.",
        rascunho.consentimento,
        function(){ rascunho.consentimento = !rascunho.consentimento; redesenhar(); });
      aceite.style.marginTop = "12px";
      tela.appendChild(aceite);

      var resumo = el("dl", "campos");
      resumo.style.marginTop = "18px";
      [["Nome", rascunho.nome], ["Refeitório", rascunho.refeitorio],
       ["Empresa", rascunho.empresa], ["Setor", rascunho.setor],
       ["Objetivo", rascunho.objetivo],
       ["Restrições", nomesDasRestricoes(rascunho.restricoes).join(", ") || "Nenhuma"]
      ].forEach(function(par){
        var linha = el("div", "campo");
        linha.appendChild(el("dt", "", escapar(par[0])));
        linha.appendChild(el("dd", "", escapar(par[1] || "—")));
        resumo.appendChild(linha);
      });
      tela.appendChild(resumo);
    }

    if (campoEdicao && estado.registro) tela.appendChild(el("p", "legenda", "A alteração vale para as próximas escolhas. O almoço já registrado mantém os dados da confirmação."));
    var ultimo = !!campoEdicao || passoAtual === PASSOS.length - 1;
    var avancar = el("button", "cta forte");
    avancar.appendChild(el("b", "", ultimo
      ? (rascunho.editando ? "Salvar alterações" : "Criar meu cadastro")
      : "Continuar"));
    avancar.appendChild(icone(ultimo ? "i-liberado" : "i-seta", ultimo ? "" : "seta"));
    if (!passoCompleto()) avancar.disabled = true;
    avancar.addEventListener("click", function(){
      if (!passoCompleto()) return;
      if (!ultimo){ passoAtual++; redesenhar(); return; }
      salvarCadastro();
    });
    acoes.appendChild(avancar);
    if (campoEdicao) acoes.appendChild(botaoMontagem("Cancelar", cancelarEdicaoDireta));
  }

  // O rotulo fica visivel, e nao so no `placeholder`: o `placeholder` some
  // quando a pessoa digita, e dois campos preenchidos lado a lado deixariam de
  // dizer qual e a empresa e qual e o setor.
  function campoTexto(campo, rotulo, exemplo){
    var caixa = el("div", "campo-texto");
    var nome = el("label", "", escapar(rotulo || campo));
    nome.setAttribute("for", "campo-" + campo);
    caixa.appendChild(nome);
    var entrada = document.createElement("input");
    entrada.type = "text";
    entrada.id = "campo-" + campo;

      // editar o cadastro nao recomeca a contagem: quem aceitou, aceitou.
      aceite: (cadastroSalvo() || {}).aceite || new Date().toISOString()

    if (campoEdicao){
      var atual = cadastroSalvo();

        campoEdicao = null; rascunho = null;
        mostrar("boas_vindas", false);
        recado("O cadastro foi removido. Crie um cadastro para continuar.");
        return;
      }
      // Atualiza somente o campo editado e preserva o aceite e os demais dados.
      var valor = dados[campoEdicao];
      dados = Object.assign({}, atual);
      dados[campoEdicao] = valor;

    var onde = guardarCadastro(dados);
    rascunho = null;
    campoEdicao = null;

    if (!editando) zerarSessao();
    mostrar(editando ? "perfil" : "inicio", false);
    if (editando){ recado("Cadastro atualizado."); return; }

      ? "Pronto, " + dados.nome + ". Seu cadastro está guardado neste aparelho."
      : "Pronto, " + dados.nome + ". Aqui na prévia o cadastro vale enquanto esta " +

  // ---------- o veredito de alergenico, do lado do navegador ----------
  //
  // O cadastro e do proprio funcionario e mora so no aparelho, entao o
  // navegador precisa decidir o veredito sozinho. Isso poe a regra dos tres
  // estados em dois lugares — aqui e em `apetit/allergens.py` — que e
  // exatamente o jeito de os dois discordarem um dia sem ninguem ver.
  //
  // A trava e `dados.conformidade`: o Python calcula o veredito de cada prato
  // para varias combinacoes de alergia, e `scripts/conferir_vereditos.py` roda
  // este codigo num navegador de verdade e falha se um unico prato divergir.
  //
  // A regra e curta porque o modelo e curto: contem bloqueia, pode conter e
  // sem declaracao pedem confirmacao, e so "nao contem" libera. Ausencia de
  // informacao nunca vira liberacao.
  var PESO_VEREDITO = { bloqueio: 3, atencao: 2, liberado: 1, sem_restricao: 0 };

  function vereditoDaDeclaracao(estado){
    if (estado === "contem") return "bloqueio";
    if (estado === "nao_contem") return "liberado";
    return "atencao";                     // pode_conter e nao_declarado
  }

  function vereditoPara(item, restricoes){
    if (!restricoes || !restricoes.length) return "sem_restricao";
    var pior = "liberado";
    restricoes.forEach(function(codigo){
      var v = vereditoDaDeclaracao((item.declaracoes || {})[codigo] || "nao_declarado");
      if (PESO_VEREDITO[v] > PESO_VEREDITO[pior]) pior = v;
    });
    return pior;
  }

  // O texto do motivo, montado das mesmas partes que o bot usa.
  function motivoPara(item, restricoes){
    var nomes = {};
    ((DADOS && DADOS.alergenicos) || []).forEach(function(a){ nomes[a.codigo] = a.nome; });
    var contem = [], pode = [], sem = [];
    (restricoes || []).forEach(function(c){
      var estado = (item.declaracoes || {})[c] || "nao_declarado";
      if (estado === "contem") contem.push(nomes[c] || c);
      else if (estado === "pode_conter") pode.push(nomes[c] || c);
      else if (estado === "nao_declarado") sem.push(nomes[c] || c);
    });
    if (contem.length){
      return "Este prato contém " + contem.join(", ").toLowerCase() +
             ", que você evita. Não recomendo pedir.";
    }
    var partes = [];
    if (pode.length) partes.push("pode conter " + pode.join(", ").toLowerCase());
    if (sem.length) partes.push("não tem declaração sobre " + sem.join(", ").toLowerCase());
    if (partes.length){
      return "Não consigo confirmar que este prato é seguro para você: " +
             partes.join(" e ") + ". Confirme no balcão antes de se servir.";
    }
    if (!restricoes || !restricoes.length) return "Você não tem restrição cadastrada.";
    return "Nenhum alergênico da sua ficha aparece neste prato.";
  }

  function etiquetaPara(item, restricoes){
    var nomes = {};
    ((DADOS && DADOS.alergenicos) || []).forEach(function(a){ nomes[a.codigo] = a.nome; });
    var contem = [], pode = [], sem = [];
    (restricoes || []).forEach(function(c){
      var estado = (item.declaracoes || {})[c] || "nao_declarado";
      if (estado === "contem") contem.push(nomes[c] || c);
      else if (estado === "pode_conter") pode.push(nomes[c] || c);
      else if (estado === "nao_declarado") sem.push(nomes[c] || c);
    });
    if (contem.length) return "Não pode: " + contem.join(", ");
    if (pode.length) return "Pode conter " + pode.join(", ").toLowerCase();
    if (sem.length) return "Confirme alergênicos";
    return "";
  }

  // ---------- foto de perfil ----------
  //
  // A foto fica **so no aparelho**, em `localStorage`, e nunca sai dele: nao ha
  // servidor nesta demonstracao, e num app de refeitorio o rosto do funcionario
  // e o dado mais identificavel que existe. Guardar no celular de quem tirou
  // mantem a promessa que o resto do app faz — a empresa nao ve.
  //
  // A imagem e reduzida a um quadrado de 256px antes de guardar. Foto de
  // celular tem 3-5 MB e o `localStorage` cabe ~5 MB: sem reduzir, a primeira
  // foto estouraria a cota e derrubaria tudo que estava guardado junto.
  var FOTO = "apetit-foto";
  var LADO = 256;

  function fotoGuardada(){
    return lido(FOTO) || "";
  }
  function guardarFoto(dados){
    return guardar(FOTO, dados);
  }
  function apagarFoto(){
    esquecer(FOTO);
  }

  // Recorte quadrado pelo centro: o avatar e redondo, e esticar a foto para
  // caber deformaria o rosto.
  function reduzirFoto(arquivo){
    return new Promise(function(resolve, reject){
      if (!/^image\//.test(arquivo.type)) { reject(new Error("nao-e-imagem")); return; }
      var url = URL.createObjectURL(arquivo);
      var img = new Image();
      img.onload = function(){
        URL.revokeObjectURL(url);
        try {
          var lado = Math.min(img.naturalWidth, img.naturalHeight);
          var tela = document.createElement("canvas");
          tela.width = tela.height = LADO;
          tela.getContext("2d").drawImage(
            img, (img.naturalWidth - lado) / 2, (img.naturalHeight - lado) / 2,
            lado, lado, 0, 0, LADO, LADO);
          resolve(tela.toDataURL("image/jpeg", 0.82));
        } catch (erro) { reject(new Error("nao-deu-para-ler")); }
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("nao-deu-para-ler")); };
      img.src = url;
    });
  }

  function numeroSolto(valor){
    var n = parseFloat(String(valor).replace(",", "."));
    return isFinite(n) && n > 0 ? n : null;

      // A comparacao com o objetivo generico e informacao de graca: os dois

      var generico = alvoDoObjetivo(pessoa().objetivo) || {};

                     : (dif > 0 ? dif + " kcal a mais." : Math.abs(dif) + " kcal a menos."))));

      // Honestidade sobre o que a ficha ainda nao faz. A sugestao de porcao sai

  function telaFichaManual(){
    cabecalhoInterno("Apetit", "Ficha do nutricionista");
    var minha = fichaSalva() || {};
    tela.appendChild(el("h1", "h1", "Os números da sua ficha"));
    tela.appendChild(el("p", "sub", "Só do almoço. Deixe em branco o que a ficha não traz."));

    var form = el("div", "pilha");
    form.style.marginTop = "16px";
    var campos = [
      ["kcal", "Calorias do almoço (kcal)", "Ex.: 700", minha.kcal || ""],
      ["ptn", "Proteína do almoço (g)", "Ex.: 35", minha.ptn || ""],
      ["profissional", "Nome do profissional (opcional)", "Ex.: Dra. Ana", minha.profissional || ""]
    ];
    var entradas = {};
    campos.forEach(function(c){
      // Mesma classe do cadastro (`campo-texto`): rotulo visivel acima da
      // caixa. Sem rotulo, "700" e "35" preenchidos ficam indistinguiveis — foi
      // o defeito que apareceu no cadastro com "empresa" e "setor".
      var bloco = el("div", "campo-texto");
      var rotulo = el("label", "", escapar(c[1]));
      rotulo.setAttribute("for", "ficha-" + c[0]);
      bloco.appendChild(rotulo);
      var input = document.createElement("input");
      input.id = "ficha-" + c[0];
      input.type = c[0] === "profissional" ? "text" : "number";
      if (c[0] !== "profissional"){ input.inputMode = "decimal"; input.min = "1"; }
      input.placeholder = c[2];
      input.value = c[3];
      input.autocomplete = "off";
      bloco.appendChild(input);
      entradas[c[0]] = input;
      form.appendChild(bloco);
    });
    tela.appendChild(form);

    tela.appendChild(notaDeSimulacao(
      "Os números ficam só neste aparelho. A Apetit e a sua empresa não recebem a sua ficha."));

    var salvar = el("button", "cta forte");
    salvar.appendChild(icone("i-liberado"));
    salvar.appendChild(el("b", "", "Guardar a ficha"));
    salvar.addEventListener("click", function(){
      var kcal = numeroSolto(entradas.kcal.value);
      var ptn = numeroSolto(entradas.ptn.value);
      if (!kcal && !ptn){
        recado("Preencha pelo menos as calorias ou a proteína.");
        return;
      }
      // Numero de dia inteiro entrando como refeicao e o erro que machuca: uma
      // ficha de 2.000 kcal lida como almoco mandaria a pessoa comer o dia todo
      // num prato. Mesma faixa que `Prescription.implausivel` usa no Python.
      if (kcal && kcal > 1500){
        recado("Esse valor parece ser do dia inteiro, não de uma refeição. Confira na ficha.");
        return;
      }
      guardar(MINHA_FICHA, JSON.stringify({
        kcal: kcal, ptn: ptn,
        profissional: entradas.profissional.value.trim(),
        em: new Date().toISOString()
      }));
      mostrar("ficha", false);
      recado("Ficha guardada neste aparelho.");
    });
    acoes.appendChild(salvar);

    var voltar = el("button", "cta fantasma");
    voltar.appendChild(el("b", "", "Cancelar"));
    voltar.addEventListener("click", function(){ mostrar("ficha", false); });
    acoes.appendChild(voltar);
  }

  // ---------- 7. gestao ----------

  // Os quatro relatorios saem de `DADOS.gestao`, calculado em Python pelas
  // mesmas funcoes que o bot usa. O n minimo de cinco pessoas e a supressao de
  // recorte pequeno chegam decididos: o numero suprimido nao vem no arquivo,
  // entao nao existe tela capaz de imprimi-lo por descuido.

  function pct(valor){
    return valor === null || valor === undefined ? "—" : Math.round(valor) + "%";
  }

  function semDados(texto){
    var vazio = el("div", "estado-exemplo");
    var ic = el("span", "estado-icone");
    ic.appendChild(icone("i-calendario"));
    vazio.appendChild(ic);

    vazio.style.marginTop = "16px";

  function linhasDe(pares){
    var dl = el("dl", "campos");
    dl.style.marginTop = "14px";
    pares.forEach(function(par){
      var linha = el("div", "campo");
      linha.appendChild(el("dt", "", escapar(par[0])));
      linha.appendChild(el("dd", "", escapar(String(par[1]))));
      dl.appendChild(linha);
    });
    tela.appendChild(dl);
    return dl;
  }

  function gestaoDados(){
    return (DADOS && DADOS.gestao) || null;
  }

  // Estes numeros sao do piloto inventado que monta a demonstracao — quinze

  // ---------- navegacao ----------
  //
  // O crawler do bot separa estados da mesma tela com sufixo ("progresso_",
  // "quanto__"). Cinco troncos agora tem tela nativa, e qualquer sufixo deles
  // cai na nativa: o botao capturado do bot continua funcionando, e a pessoa
  // chega na tela boa em vez de na transcricao.
  // A ordem importa: "ficha_manual" tem tela propria e precisa ser testada antes
  // do tronco "ficha", senao o formulario nunca abre.
  var TRONCOS = ["cardapio", "quanto", "avaliar", "progresso", "perfil",
                 "ficha_manual", "ficha", "favoritos", "avisos", "ajuda",
                 "piloto", "relatorio", "atendimento", "cobertura", "meu_dia"];

  function destinoReal(id){
    if (NATIVAS[id]) return id;
    // Nenhum atalho antigo pode voltar ao montador gravado da Mariana.
    if (/^(pick:|flow_|registrar(?:_|$))/.test(id)) return "montar";
    // O passo a passo da ficha no bot virou uma tela com formulario: qualquer
    // "ficha_campo:kcal", "ficha_escopo:dia" ou "ficha_ok" capturado cai nela.
    if (/^ficha_(campo|escopo|ok|rever|pdf|cancelar|remover)/.test(id)) return "ficha";
    // "fav:carne_assada" e "fav_lista" sao o favorito clicado no bot.
    if (/^fav(?:_|:)/.test(id)) return "favoritos";
    if (/^aviso:/.test(id)) return "avisos";
    for (var i = 0; i < TRONCOS.length; i++){
      if (id.indexOf(TRONCOS[i]) === 0) return TRONCOS[i];
    }
    // "aval_comida:3" e o clique de nota no bot; a avaliacao agora e nativa.
    if (/^aval_/.test(id)) return "avaliar";
    return id;
  }

  function mostrar(id, guardar){
    var alvo = destinoReal(id);
    var nativa = NATIVAS[alvo];
    // Sem tela nativa nao ha o que mostrar. Antes existia um terceiro caso — a
    // transcricao capturada do bot — e ele sumiu junto com o bot: todas as
    // telas do app sao escritas aqui agora.
    if (!nativa) return;
    if (guardar !== false && atual !== alvo) historico.push(atual);
    atual = alvo;

    tela.textContent = "";
    acoes.textContent = "";
    tela.classList.remove("entrando");
    void tela.offsetWidth;
    tela.classList.add("entrando");

    nativa();

    abas.hidden = !!SEM_ABAS[alvo];
    marcarAba(alvo);
    tela.scrollTop = 0;
    tela.focus({ preventScroll: true });
  }

  // ---------- ler a ficha que a pessoa anexar ----------
  //
  // O bot le PDF em Python. Aqui, para a pessoa poder testar com a ficha dela
  // sem o bot no ar, a mesma leitura roda no navegador — e as regras vem de
  // `regras.json`, gerado do proprio `apetit/prescription.py`. Duplicar regex
  // em dois idiomas seria o caminho mais curto para as duas leituras
  // discordarem justamente no documento de alguem.
  var REGRAS = (window.__APETIT__ || {}).regras || null;
  if (!REGRAS){
    fetch("regras.json").then(function(r){ return r.json(); })
      .then(function(d){ REGRAS = d; }).catch(function(){ /* segue sem anexo */ });
  }

  function re(padrao, flags){
    // Python nomeia grupo com (?P<x>...); JS usa (?<x>...).
    return new RegExp(String(padrao).replace(/\(\?P</g, "(?<"), flags || "");
  }

  async function lerPdf(arquivo){
    if (!window.pdfjsLib) throw new Error("leitor-indisponivel");
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    var buffer = await arquivo.arrayBuffer();
    var pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    var partes = [];
    for (var n = 1; n <= pdf.numPages; n++){
      var pagina = await pdf.getPage(n);
      var conteudo = await pagina.getTextContent();
      // Um item por linha aproxima o que o pypdf devolve, que e o formato que
      // as regras esperam.
      partes.push(conteudo.items.map(function(i){ return i.str; }).join("\n"));
    }
    return partes.join("\n");
  }

  function planoDoTexto(texto){
    if (!REGRAS) return [];
    texto = texto.replace(re(REGRAS.rodape, "gs"), "\n");
    var cabecalho = re("^\\s*" + REGRAS.refeicoes + "\\s*$", "gmi");
    var marcas = [], m;
    while ((m = cabecalho.exec(texto)) !== null){
      marcas.push({ nome: m[1], inicio: m.index, fim: cabecalho.lastIndex });
    }
    var almoco = null;
    for (var i = 0; i < marcas.length; i++){
      if (!/almo[çc]o/i.test(marcas[i].nome)) continue;
      var ate = (i + 1 < marcas.length) ? marcas[i+1].inicio : texto.length;
      almoco = texto.slice(marcas[i].fim, ate);
      break;
    }
    if (almoco === null) return [];
    var corte = almoco.indexOf("•");
    return itensDoBloco(corte > 0 ? almoco.slice(0, corte) : almoco);
  }

  function itensDoBloco(bloco){
    bloco = bloco.replace(/\s*\n\s*/g, " ").trim();
    var ancora = re(REGRAS.ancora, "gi");
    var quantidade = re(REGRAS.quantidade, "s");
    var itens = [], pos = 0, m;
    while ((m = ancora.exec(bloco)) !== null){
      var trecho = bloco.slice(pos, m.index).trim();
      pos = ancora.lastIndex;
      if (!trecho) continue;

      var nome = trecho, qtd = null, medida = "";
      var partido = quantidade.exec(trecho);
      if (partido && partido.groups && partido.groups.nome.trim()){
        nome = partido.groups.nome.trim();
        qtd = partido.groups.qtd;
        medida = partido.groups.medida.trim();
      }
      var peso = "";
      if (m[3]){ medida = "a vontade"; qtd = null; }
      else if (m[1]){ peso = m[1] + " " + m[2].toLowerCase(); }
      else if (m[4]){ peso = m[4] + " ml"; }

      nome = nome.replace(/^[\s\-•]+|[\s\-•]+$/g, "");
      if (nome) itens.push({ nome: nome, qtd: qtd, medida: medida, peso: peso });
    }
    return itens;
  }

  function medidaDe(item){
    if (item.medida === "a vontade") return "à vontade";
    var partes = [];
    if (item.qtd) partes.push((item.qtd + " " + item.medida).trim());
    else if (item.medida) partes.push(item.medida);
    if (item.peso) partes.push("(" + item.peso + ")");
    return partes.join(" ");
  }

  // O plano lido do PDF e o recado de leitura, guardados aqui para as telas
  // nativas desenharem. Eram duas entradas sinteticas em `TELAS`, montadas em
  // JavaScript e renderizadas pelo desenhista de transcricao do bot — o ultimo
  // lugar do app que ainda dependia daquele formato.
  var planoLido = null, recadoDaFicha = null;

    var lista = el("div", "pilha");

    dados.itens.forEach(function(i){
      var medida = medidaDe(i);
      var linha = el("div", "item");
      linha.appendChild(chip("i-folha", true));
      linha.appendChild(el("span", "item-texto",
        "<b>" + escapar(i.nome) + "</b>" + (medida ? "<small>" + escapar(medida) + "</small>" : "")));
      lista.appendChild(linha);
    });
    tela.appendChild(lista);

    var explica = el("div", "cartao");
    explica.style.marginTop = "16px";
    explica.appendChild(el("p", "paragrafo",
      "Sua ficha é um plano alimentar: ela lista alimento e medida, não caloria."));
    explica.appendChild(el("p", "legenda",
      "O documento não fica guardado — só esta lista."));
    tela.appendChild(explica);

    var guardar_ = el("button", "cta forte");
    guardar_.appendChild(icone("i-liberado"));
    guardar_.appendChild(el("b", "", "É isso, pode guardar"));
    guardar_.addEventListener("click", function(){
      guardar(MINHA_FICHA, JSON.stringify({
        kcal: null, ptn: null, profissional: "",
        plano: dados.itens.map(function(i){
          return { nome: i.nome, medida: medidaDe(i) };
        }),
        em: new Date().toISOString()
      }));
      mostrar("ficha", false);
      recado("Ficha guardada neste aparelho.");
    });
    acoes.appendChild(guardar_);

    var outra = el("button", "cta fantasma");
    outra.appendChild(icone("i-arquivo"));
    outra.appendChild(el("b", "", "Anexar outra ficha"));
    outra.addEventListener("click", function(){
      document.getElementById("arquivo-pdf").click();
    });
    acoes.appendChild(outra);
  }

  function telaDeAviso(tituloAviso, corpo){
    recadoDaFicha = { titulo: tituloAviso, corpo: corpo };
    mostrar("ficha_recado");
  }

  function telaFichaRecado(){
    cabecalhoInterno("Apetit", "Ficha do nutricionista");
    var r = recadoDaFicha || { titulo: "", corpo: "" };
    tela.appendChild(el("h1", "h1", escapar(r.titulo)));
    var caixa = el("div", "cartao");
    caixa.style.marginTop = "14px";
    // O corpo e escrito aqui no arquivo, com <b> e <i> de propósito; nao vem
    // de fora.
    String(r.corpo).split("\n\n").forEach(function(p){
      if (p.trim()) caixa.appendChild(el("p", "paragrafo", p));
    });
    tela.appendChild(caixa);

    var outra = el("button", "cta forte");
    outra.appendChild(icone("i-arquivo"));
    outra.appendChild(el("b", "", "Tentar outro arquivo"));
    outra.addEventListener("click", function(){
      document.getElementById("arquivo-pdf").click();
    });
    acoes.appendChild(outra);

    var digitar = el("button", "cta fantasma");
    digitar.appendChild(icone("i-lapis"));
    digitar.appendChild(el("b", "", "Digitar os números"));
    digitar.addEventListener("click", function(){ mostrar("ficha_manual"); });
    acoes.appendChild(digitar);
  }

  var entrada = document.getElementById("arquivo-pdf");
  entrada.addEventListener("change", async function(){
    var arquivo = entrada.files && entrada.files[0];
    entrada.value = "";
    if (!arquivo) return;

    telaDeAviso("Lendo " + arquivo.name + "…", "Só um instante.");
    try {
      var texto = await lerPdf(arquivo);
      var itens = planoDoTexto(texto);
      if (itens.length){ telaDoPlano(itens, arquivo.name); return; }
      telaDeAviso(
        "Não achei um almoço nessa ficha",
        "Eu procuro uma seção de <b>Almoço</b> com os alimentos e as medidas.\n\n" +
        "Se a ficha for foto ou digitalização, o arquivo tem a imagem do texto e " +
        "não o texto — eu não tento adivinhar letra de imagem, porque errar aqui " +
        "vira orientação errada a partir de um documento clínico.\n\n" +
        "Nesse caso, digite os números."
      );
    } catch (erro) {
      telaDeAviso(
        "Não consegui abrir esse arquivo",
        erro && erro.message === "leitor-indisponivel"
          ? "O leitor de PDF não carregou aqui. Use o exemplo pronto para ver o " +
            "caminho, ou digite os números."
          : "Ele pode estar protegido por senha ou corrompido. Tente outro arquivo " +
            "ou digite os números."
      );
    }
  });



  // ---------- estados de carga ----------
  function esqueleto(){
    cabecalhoInicio();
    tela.textContent = "";
    [188, 58, 58, 22, 64, 64].forEach(function(altura, n){
      var bloco = el("div", "esqueleto");
      bloco.style.height = altura + "px";
      bloco.style.marginTop = n ? "14px" : "0";
      if (altura === 22) bloco.style.width = "45%";
      tela.appendChild(bloco);
    });
  }

  function falhou(){
    cabecalhoInicio();
    tela.textContent = "";
    var c = el("div", "vazio");
    c.appendChild(icone("i-atencao"));
    c.appendChild(el("b", "", "Não foi possível carregar o cardápio."));
    c.appendChild(el("span", "", "Verifique a conexão e tente de novo. Se você abriu o arquivo " +
      "direto do disco, use um servidor: python -m http.server na pasta demo/."));
    tela.appendChild(c);

    var tentar = el("button", "cta forte");
    tentar.style.marginTop = "16px";
    tentar.appendChild(icone("i-atualizar"));
    tentar.appendChild(el("b", "", "Tentar novamente"));
    tentar.addEventListener("click", carregar);
    tela.appendChild(tentar);
  }

  // ---------- carga ----------
  //
  // Servido por HTTP, o app busca os arquivos. Empacotado numa pagina so — e
  // o que acontece quando ele vira um link para alguem testar —, os mesmos
  // dados ja chegam embutidos em `window.__APETIT__`. Um caminho de codigo,
  // dois jeitos de entregar.
  // ---------- de onde vem o cardapio ----------
  //
  // O arquivo local e uma fotografia: foi gerado uma vez e publicado junto com
  // a pagina. Serve para a demonstracao e serve de rede quando o servidor nao
  // responde, mas *nao e o cardapio de hoje* — e num app de alergia essa
  // diferenca nao e detalhe de implementacao. Alguem planejando o almoco contra
  // o cardapio da semana passada esta conferindo alergenico do prato errado.
  //
  // Por isso o app nunca apresenta a fotografia como se fosse a de hoje: quando
  // o dado nao veio do servidor, ou veio de outro dia, a tela diz.

  function enderecoDaApi(){
    // Ordem: o que a pessoa configurou no aparelho (para testar), depois o que a
    // pagina declara. Vazio significa que nao ha servidor — e o app inteiro
    // continua funcionando com a fotografia, que e como o piloto testa hoje.
    var doAparelho = lido("apetit-api");
    if (doAparelho) return doAparelho.replace(/\/+$/, "");
    var marca = document.querySelector('meta[name="apetit-api"]');
    var declarado = marca ? (marca.getAttribute("content") || "").trim() : "";
    return declarado.replace(/\/+$/, "");
  }

  function hojeISO(){
    var d = new Date();
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }

  function unidadeAtual(local){
    var salvo = cadastroSalvo();
    if (salvo && salvo.refeitorio) return salvo.refeitorio;
    return (local && local.unidade) || "";
  }

  function buscarDoServidor(local){
    var base = enderecoDaApi();
    var unidade = unidadeAtual(local);
    if (!base || !unidade) return Promise.resolve(null);
    var url = base + "/api/dia?unidade=" + encodeURIComponent(unidade) +
              "&dia=" + encodeURIComponent(hojeISO());
    // Um limite de tempo curto: sem ele, um servidor que aceita a conexao e nao
    // responde deixa a pessoa olhando o esqueleto — pior que mostrar a
    // fotografia avisando que e fotografia.
    var corta = new Promise(function(_, rejeita){
      setTimeout(function(){ rejeita(new Error("tempo")); }, 6000);
    });
    return Promise.race([
      fetch(url, { headers: { "Accept": "application/json" } }).then(function(r){
        if (!r.ok) throw new Error("http " + r.status);
        return r.json();
      }),
      corta
    ]).catch(function(){ return null; });
  }

  function marcarProcedencia(dados, doServidor){
    if (!dados) return dados;
    dados.__fonte__ = doServidor ? "servidor" : "arquivo";
    // "De hoje" e sobre a data do cardapio, e nao sobre ter vindo da rede: um
    // servidor pode devolver o cardapio de ontem, e uma fotografia gerada hoje
    // de manha esta correta. Quem manda e a data.
    dados.__do_dia__ = dados.dia === hojeISO();
    return dados;
  }

  // O aviso que aparece em toda tela que fala de comida. Null quando o cardapio
  // e de hoje: nesse caso nao ha o que ressalvar, e um aviso permanente ensina
  // a pessoa a ignorar avisos.
  function avisoDeFonte(){
    if (!DADOS || DADOS.__do_dia__) return null;
    var caixa = el("div", "aviso wrn");
    caixa.appendChild(icone("i-info"));
    var quando = DADOS.dia_amigavel || DADOS.dia || "";
    caixa.appendChild(el("span", "", DADOS.__fonte__ === "servidor"
      ? "<b>Este não é o cardápio de hoje.</b> O servidor respondeu com o cardápio de " +
        escapar(quando) + ". Confira no refeitório antes de se servir."
      : "<b>Este não é o cardápio de hoje.</b> É o cardápio de " + escapar(quando) +
        ", guardado neste aparelho. Confira no refeitório antes de se servir."));
    return caixa;
  }

  function porFonte(){
    var aviso = avisoDeFonte();
    if (aviso) tela.appendChild(aviso);
  }

  function carregar(){
    esqueleto();
    // Um arquivo so agora. O segundo era `telas.json`, com as telas capturadas
    // do bot; com todas as telas escritas aqui, ele deixou de existir.
    var embutido = window.__APETIT__;
    var local = embutido
      ? Promise.resolve(embutido.dados || null)
      : fetch("dados.json").then(function(r){
          if (!r.ok) throw new Error("dados");
          return r.json();
        });

    local.then(function(fotografia){
      // O servidor so e consultado depois de a fotografia estar em maos: assim
      // um servidor fora do ar nunca deixa o app sem cardapio nenhum.
      return buscarDoServidor(fotografia).then(function(doDia){
        if (doDia && (doDia.cardapio || []).length){
          // O servidor manda o que e **do dia** e igual para a unidade inteira.
          // O que e do exemplo — perfil, historico, relatorios — so existe na
          // fotografia, e continua vindo dela.
          DADOS = marcarProcedencia(Object.assign({}, fotografia || {}, doDia), true);
        } else {
          DADOS = marcarProcedencia(fotografia, false);
        }
        liberarAbas();
        estado.pontos = meuHistorico().progresso.pontos;
        // Primeira vez: cadastro. Depois, direto para o app — a boas-vindas some
        // e nao volta a atrapalhar quem ja se cadastrou.
        mostrar(cadastroSalvo() ? "inicio" : "boas_vindas", false);
      });
    }).catch(falhou);
  }

  carregar();

})();

</script>
