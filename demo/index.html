<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apetit</title>
<meta name="description" content="Acompanhamento nutricional do refeitório Apetit.">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EC003F">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Apetit">
<meta name="mobile-web-app-capable" content="yes">

<!-- pdf.js na build UMD, que define window.pdfjsLib. Se nao carregar, o app
     avisa em vez de quebrar: ver `lerPdf` no script. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

<style>
/* ===========================================================================
   Apetit — sistema de design.

   O vermelho #EC003F e o amarelo #F5D94E sao a marca: vermelho no destaque
   da refeicao, amarelo na acao principal. Superficies neutras organizam o resto.

   Por isso o semaforo de alergenico nao usa nenhum dos dois. O aviso mais
   importante do app e o "nao pode", e se ele fosse do mesmo vermelho que
   decora a tela inteira viraria enfeite. Restricao, atencao e liberado tem
   escala propria, e ela nunca aparece sozinha: cor sempre vem com icone e
   palavra, para quem nao distingue as duas nao ficar sem a informacao.
   ======================================================================== */
:root{
  --vermelho:#EC003F;
  --vermelho-alto:#FF2057;
  --vermelho-baixo:#B80031;
  --amarelo:#F5D94E;
  --amarelo-alto:#FFE97A;
  --amarelo-ink:#121212;

  --fundo:#0D0F11;
  --card:#171A1D;
  --card-2:#1D2024;
  --card-3:#292D32;

  --texto:#FFFFFF;
  --texto-2:#B1B3BC;
  --texto-3:#989BA5;

  --verde:#45D490;
  --verde-fundo:rgba(69,212,144,.12);
  --laranja:#F4A72C;
  --laranja-fundo:rgba(244,167,44,.12);
  --restricao:#FF6B6B;
  --restricao-fundo:rgba(255,107,107,.12);
  --neutro-fundo:rgba(255,255,255,.06);

  --linha:rgba(255,255,255,.07);
  --linha-2:rgba(255,255,255,.12);

  --r-card:16px;
  --r-btn:14px;
  --r-pill:999px;
  --h-cta:54px;
  --pad:18px;
  --gap:12px;
  --gap-secao:24px;

  --rapido:150ms;
  --medio:190ms;
  --lento:220ms;
  --curva:cubic-bezier(.22,.61,.36,1);

  --fotos:url("assets/pratos.webp");
  --sombra:0 1px 2px rgba(0,0,0,.32), 0 10px 26px -22px rgba(0,0,0,.9);

  --t-h1:26px;
  --t-h2:17px;
  --t-card:17px;
  --t-body:14px;
  --t-label:12px;
}

*{box-sizing:border-box}
html,body{height:100%}
p,dl{margin:0}
button,a{touch-action:manipulation}
button:disabled{cursor:default}
::selection{background:var(--vermelho);color:#fff}
body{
  margin:0;background:var(--fundo);color:var(--texto);
  font-family:Inter,"SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  font-size:var(--t-body);line-height:1.55;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.icone{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;
       stroke-linecap:round;stroke-linejoin:round}

.app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;background:var(--fundo);overflow:hidden}
.app > *{min-width:0}

/* ---------- cabecalho ---------- */
.topo{flex:none;position:relative;z-index:2;background:var(--fundo)}
.topo .barra{display:flex;align-items:center;gap:12px}
.topo .titulo{flex:1;min-width:0;text-align:center}
.topo .titulo h1{font-size:21px;font-weight:800;line-height:1.25;letter-spacing:-.025em}
.topo .titulo p{margin-top:3px;font-size:10px;color:var(--texto-2)}
.topo.marca{background:linear-gradient(135deg,#F80045,var(--vermelho) 60%,#C70039);
  padding:18px 15px 20px;padding-top:calc(18px + env(safe-area-inset-top));border-radius:0 0 25px 25px}
.topo.marca .titulo h1{font-size:28px}
.topo .apoio{margin-top:10px;text-align:center;font-size:9px;font-weight:700;letter-spacing:.19em;color:#fff}
.crculo{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:transparent;border:0;cursor:pointer;position:relative;color:var(--texto-2);transition:background var(--rapido)}
.crculo::before{content:"";position:absolute;inset:7px;border:1px solid var(--linha-2);border-radius:50%;background:rgba(255,255,255,.025)}
.crculo .icone{width:18px;height:18px}
.topo.marca .crculo{color:white}
.topo.marca .crculo::before{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)}
.crculo:hover{background:var(--neutro-fundo)}
.crculo:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
.topo.simples{padding:8px 12px 6px;padding-top:calc(8px + env(safe-area-inset-top))}

/* ---------- corpo ---------- */
.tela{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--card-3) transparent;-webkit-overflow-scrolling:touch;padding:16px var(--pad) 24px}
.tela > * + *{margin-top:var(--gap)}
.tela:focus{outline:none}
.tela.entrando{animation:entrar var(--medio) var(--curva)}
@keyframes entrar{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--texto-3)}
.h1{font-size:var(--t-h1);font-weight:800;line-height:1.16;letter-spacing:-.03em}
.h2{font-size:var(--t-h2);font-weight:700;letter-spacing:-.02em}
.sub{color:var(--texto-2);font-size:var(--t-body)}
.legenda{color:var(--texto-2);font-size:13px;line-height:1.55}
.tela > .eyebrow + .h1{margin-top:6px}
.tela > .h1 + .sub{margin-top:8px}

.cabeca-secao{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-top:var(--gap-secao)}
.cabeca-secao h2{font-size:var(--t-h2);font-weight:700;flex:1;min-width:0;letter-spacing:-.02em}
/* A linha de apoio quebra em vez de ser cortada: titulo longo em portugues e
   comum, e "SEU" sozinho na borda nao e apoio nenhum. */
.cabeca-secao span{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--texto-3);text-align:right;flex:none;max-width:44%;line-height:1.35}
.tela > .cabeca-secao + *{margin-top:12px}

.cartao{background:var(--card);border:1px solid var(--linha);border-radius:var(--r-card);padding:18px;box-shadow:var(--sombra)}
.cartao > * + *{margin-top:12px}

/* ---------- inicio ---------- */
.inicio-frase{font-size:12px;color:var(--texto-2);margin-bottom:18px}
.conquistas{border:1px solid var(--linha-2);border-radius:18px;padding:16px;
  background:radial-gradient(ellipse at 100% 0%,rgba(236,0,63,.22),transparent 65%),linear-gradient(140deg,#1B1E22,#111315);box-shadow:var(--sombra)}
.conq-topo{display:flex;align-items:center;gap:12px}
.conq-topo h2{font-size:16px;letter-spacing:-.02em}
.conq-topo .chip{width:40px;height:40px;border-radius:12px}
.conq-corpo{display:flex;align-items:center;gap:16px;margin-top:14px}
.conq-lista{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.conq-item{display:flex;align-items:flex-start;gap:9px;font-size:12px;line-height:1.35;color:var(--texto)}
.conq-item .tick{width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--vermelho);color:white}
.conq-item .tick .icone{width:12px;height:12px;stroke-width:2.5}
.conq-item.nova .tick{animation:pulsar 420ms var(--curva)}
@keyframes pulsar{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.pontos{flex:none;width:104px;text-align:center}
.anel{width:96px;height:96px;margin:auto;position:relative;display:grid;place-items:center}
.anel > svg{position:absolute;inset:0;width:100%;height:100%}
.anel .n{font-size:31px;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.pontos .l{display:block;font-size:9px;font-weight:700;line-height:1.45;letter-spacing:.12em;margin-top:4px;color:var(--texto-2);text-transform:uppercase}
.home-acoes{display:flex;flex-direction:column;gap:12px}
.home-rapidas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.home-rapidas .item{min-height:76px;padding:12px 10px;gap:9px}
.home-rapidas .item b{font-size:12px}
.home-rapidas .chip{width:36px;height:40px;border-radius:11px}
.home-rapidas .seta{width:13px;height:13px}
.home-acoes .leve > .icone{color:var(--amarelo)}
.item .item-texto{flex:1;min-width:0}
.item .item-texto b{display:block}
.item small{display:block;color:var(--texto-2);font-size:11px;line-height:1.4;margin-top:4px;font-weight:400}
.lista-atalhos{background:var(--card);border:1px solid var(--linha);border-radius:var(--r-card);overflow:hidden}
.lista-atalhos .item{border:0;border-radius:0;box-shadow:none;min-height:46px;padding:9px 12px;background:transparent}
.lista-atalhos .item + .item{border-top:1px solid var(--linha)}
.lista-atalhos .chip{width:26px;height:26px;border-radius:8px}
.lista-atalhos .chip .icone{width:16px;height:16px}
.lista-atalhos .item:focus-visible{outline-offset:-3px}
.foto-prato{display:block;flex:none;width:58px;height:58px;border-radius:10px;background-image:var(--fotos);
  background-size:400% 216%;background-position:0 0;background-color:var(--card-3)}
.foto-ovo{background-position:33.333% 0}
.foto-macarrao{background-position:66.667% 0}
.foto-arroz{background-position:100% 0}
.foto-feijao,.foto-salada,.foto-refeicao{background-size:400% 186%}
.foto-feijao{background-position:0 100%}
.foto-salada{background-position:33.333% 100%}
.foto-refeicao{background-position:66.667% 100%}
.fotos-nota{font-size:10px;color:var(--texto-2)}
.filtros{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:1px 0 4px}
.filtro{flex:1;min-height:44px;border:1px solid var(--linha-2);border-radius:var(--r-pill);padding:7px 10px;
  background:var(--card);color:var(--texto-2);font-size:11px;cursor:pointer;white-space:nowrap}
.filtro[aria-pressed="true"]{background:var(--vermelho);border-color:var(--vermelho);color:white;font-weight:600}
.filtro:focus-visible{outline:2px solid var(--amarelo);outline-offset:-2px}
.prato-resumo{background:linear-gradient(135deg,rgba(245,217,78,.18),var(--card) 90%);border-color:rgba(245,217,78,.32);border-left:4px solid var(--amarelo)}
.prato-resumo .prato-ficha{display:flex;gap:16px;align-items:center;margin-top:12px}
.prato-resumo .foto-prato{width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.16)}
.prato-resumo .macros{flex:1;min-width:0}
.prato-resumo .macros > b{display:block;font-size:23px;line-height:1.2;letter-spacing:-.035em}
.prato-resumo .macros > span{display:block;font-size:14px;margin-top:5px;font-weight:600}
.prato-resumo .objetivo-resumo{display:flex;align-items:center;gap:9px;margin-top:16px;font-size:11px;line-height:1.4;color:var(--texto-2)}
.objetivo-resumo .icone{color:var(--amarelo);width:23px;height:23px}
.objetivo-resumo b{display:block;color:var(--texto);font-size:11px;font-weight:500}
.estimativa{border:1px solid var(--linha);border-radius:12px;padding:12px;background:var(--card)}
.estimativa b{font-size:12px;font-weight:600}
.estimativa p{font-size:11px;color:var(--texto-2);line-height:1.5;margin-top:5px}
.resumo-progresso{display:flex;align-items:center;gap:13px;background:linear-gradient(130deg,rgba(245,217,78,.14),var(--card) 70%)}
.resumo-progresso .pontos{width:75px}
.resumo-progresso .anel{width:72px;height:72px}
.resumo-progresso .anel .n{font-size:24px}
.resumo-progresso .pontos .l{display:none}
.resumo-progresso .placar-label{font-size:11px;line-height:1.4;max-width:9ch}
.resumo-progresso .resumo-mensagem{flex:1;border-left:1px solid var(--linha-2);padding-left:15px;font-size:11px;line-height:1.5;color:var(--texto-2)}
.periodos{display:flex;padding:3px;background:var(--card);border:1px solid var(--linha);border-radius:11px}
.periodos .filtro{border-radius:8px;border:0;min-height:44px;background:transparent;padding:5px}
.periodos .filtro[aria-pressed="true"]{background:var(--vermelho)}
.discreto{border:1px solid var(--linha);border-radius:12px;background:var(--card);padding:11px 13px;font-size:12px;color:var(--texto-2)}
.discreto summary{cursor:pointer;color:var(--texto);min-height:24px;font-weight:500}
.discreto[open] summary{margin-bottom:10px}
.discreto > .interruptor{margin-top:8px}
.gestao-nota{text-align:center;font-size:11px;color:var(--texto-2);line-height:1.6;margin-top:28px}
.estado-exemplo{display:flex;gap:14px;align-items:center;border:1px solid var(--linha);border-radius:14px;padding:18px;background:var(--card);font-size:13px}
.estado-exemplo .estado-icone{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--neutro-fundo)}
.estado-exemplo b{display:block;font-size:13px}
.estado-exemplo p{font-size:11px;color:var(--texto-2);margin-top:5px;line-height:1.5}
.estado-exemplo.erro{background:linear-gradient(120deg,var(--restricao-fundo),var(--card));border-color:rgba(255,107,107,.2)}
.estado-exemplo.erro .estado-icone{color:var(--restricao);background:var(--restricao-fundo)}
.estado-exemplo.sucesso{background:linear-gradient(120deg,var(--verde-fundo),var(--card));border-color:rgba(69,212,144,.2)}
.estado-exemplo.sucesso .estado-icone{color:var(--verde);background:var(--verde-fundo)}
.estado-exemplo.loading{justify-content:center;flex-direction:column;text-align:center}
.estado-exemplo.loading .icone{animation:girar 1s linear infinite;color:var(--texto-2)}
@keyframes girar{to{transform:rotate(360deg)}}

/* ---------- botoes ---------- */
.cta{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  min-height:var(--h-cta);border-radius:var(--r-btn);padding:0 18px;cursor:pointer;
  transition:transform var(--rapido) var(--curva), filter var(--medio) var(--curva),
             background var(--medio) var(--curva), border-color var(--medio) var(--curva);
}
.cta:active{transform:scale(.98)}
.cta b{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px;font-weight:700;letter-spacing:-.01em}
.cta .seta{opacity:.5;width:18px;height:18px}
.cta:focus-visible{outline:2px solid var(--amarelo);outline-offset:3px}
.cta.forte{background:var(--amarelo);color:var(--amarelo-ink);border:0;
  box-shadow:0 8px 22px -16px rgba(245,217,78,.6)}
.cta.forte:hover{filter:brightness(1.05)}
.cta.leve{background:var(--card);color:var(--texto);border:1px solid var(--linha-2);box-shadow:var(--sombra)}
.cta.leve:hover{background:var(--card-2);border-color:rgba(255,255,255,.2)}
.cta.fantasma{background:transparent;border:1px solid var(--linha-2);color:var(--texto-2)}
.cta.fantasma:hover{color:var(--texto);border-color:var(--linha-2);background:var(--card)}
.cta.feito{background:var(--verde-fundo);color:var(--verde);border:1px solid rgba(69,212,144,.3);box-shadow:none}
.cta[disabled]{opacity:.45;cursor:default}
.cta[disabled]:active{transform:none}
.so-bot{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--texto-3)}

/* ---------- lista de itens ---------- */
.grade{display:grid;gap:12px}
.grade.uma{grid-template-columns:1fr}
.grade.duas{grid-template-columns:1fr 1fr}
.grade.tres{grid-template-columns:repeat(3,1fr)}

.item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;
  background:var(--card);border:1px solid var(--linha);border-radius:var(--r-card);
  padding:12px 14px;cursor:pointer;box-shadow:var(--sombra);
  transition:background var(--medio) var(--curva), border-color var(--medio) var(--curva),
             transform var(--rapido) var(--curva);
}
.item:hover{background:var(--card-2);border-color:var(--linha-2)}
.item:active{transform:scale(.98)}
.item:focus-visible{outline:2px solid var(--vermelho-alto);outline-offset:2px}
.item b{flex:1;font-size:14px;font-weight:600;line-height:1.3;min-width:0;letter-spacing:-.005em}
.item .seta{color:var(--texto-3);width:16px;height:16px;flex:none}
.item[disabled]{opacity:.45;cursor:default}
.chip{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,#FF1450,#D20039);color:white;box-shadow:0 5px 14px -8px rgba(236,0,63,.6)}
.chip .icone{width:19px;height:19px}
.chip.calmo{background:var(--card-3);color:var(--texto-2);box-shadow:none}
.grade.tres .item{flex-direction:column;align-items:flex-start;gap:10px;padding:14px 12px;min-height:0}
.grade.tres .item b{font-size:13px;flex:none}
.grade.tres .item .seta{display:none}

/* ---------- cardapio compacto ---------- */
.prato{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--linha);border-radius:var(--r-card);
  padding:12px 14px;cursor:pointer;min-height:64px;
  transition:background var(--medio) var(--curva), border-color var(--medio) var(--curva),
             transform var(--rapido) var(--curva);
}
.prato:hover{background:var(--card-2);border-color:var(--linha-2)}
.prato:active{transform:scale(.98)}
.prato:focus-visible{outline:2px solid var(--vermelho-alto);outline-offset:2px}
.prato{padding:8px;min-height:76px;gap:10px;border-radius:13px;box-shadow:var(--sombra)}
.prato .corpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.prato .nome{font-size:12px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
/* Papel e selos na mesma linha: em pilha, seis pratos viravam seis blocos de
   130px e a pessoa rolava a tela inteira para ver o almoco de um dia so. */
.prato .selos{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.prato .papel{font-size:10px;color:var(--texto-2);line-height:1.3}
.prato .seta{color:var(--texto-3);width:16px;height:16px;flex:none}
.prato.blk{border-color:rgba(255,107,107,.35)}
.prato.okk{border-color:rgba(69,212,144,.23)}
.prato.wrn{border-color:var(--linha-2)}

.selo-tag{
  display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);
  padding:2px 7px;font-size:10px;font-weight:600;line-height:1.4;white-space:normal;overflow-wrap:anywhere;
  background:var(--neutro-fundo);color:var(--texto-2);
}
.selo-tag .icone{width:12px;height:12px;stroke-width:2.4}
.selo-tag.verde{background:var(--verde-fundo);color:var(--verde)}
.selo-tag.laranja{background:var(--laranja-fundo);color:var(--laranja)}
.selo-tag.vermelho{background:var(--restricao-fundo);color:var(--restricao)}

/* ---------- resumo numerico ---------- */
.resumo{
  background:linear-gradient(160deg,var(--card-2),#141416);
  border:1px solid var(--linha-2);border-radius:var(--r-card);padding:18px;box-shadow:var(--sombra);
}
.resumo .numeros{display:flex;gap:26px;margin-top:10px;flex-wrap:wrap}
.resumo .numero b{display:block;font-size:30px;font-weight:800;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.resumo .numero span{display:block;font-size:12px;color:var(--texto-2);margin-top:5px}
.resumo .rodape{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--linha);font-size:13px;color:var(--texto-2)}
.resumo .rodape b{color:var(--texto);font-weight:600}

.linha-porcao{
  display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:43px;
  background:var(--card);border:1px solid var(--linha);border-radius:11px;padding:9px 12px;
}
.linha-porcao .nome{font-size:12px;font-weight:600;letter-spacing:-.005em}
.linha-porcao .medida{
  font-size:12px;font-weight:700;color:var(--texto);max-width:48%;text-align:right;
  background:var(--card-3);border:1px solid var(--linha-2);border-radius:var(--r-pill);padding:3px 9px;
}
.pilha{display:flex;flex-direction:column;gap:7px}

.resumo.prato-resumo{background:linear-gradient(135deg,rgba(245,217,78,.18),var(--card) 90%);border-color:rgba(245,217,78,.32);border-left:4px solid var(--amarelo)}
.resumo.resumo-progresso{background:linear-gradient(130deg,rgba(245,217,78,.14),var(--card) 70%)}
/* ---------- avaliacao ---------- */
.notas{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.avaliacao-nota{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  min-height:112px;background:var(--card);border:1.5px solid var(--linha);
  border-radius:var(--r-card);cursor:pointer;padding:14px 8px;
  transition:border-color var(--medio) var(--curva), background var(--medio) var(--curva),
             transform var(--rapido) var(--curva);
}
.avaliacao-nota .icone{width:42px;height:42px;color:var(--texto-2);transition:color var(--medio) var(--curva)}
.avaliacao-nota span{font-size:13.5px;font-weight:600;color:var(--texto-2);transition:color var(--medio) var(--curva)}
.avaliacao-nota:hover{border-color:var(--linha-2);background:var(--card-2)}
.avaliacao-nota:active{transform:scale(.98)}
.avaliacao-nota:focus-visible{outline:2px solid var(--vermelho-alto);outline-offset:2px}
.avaliacao-nota[aria-pressed="true"]{background:var(--card-2);animation:escolher 260ms var(--curva)}
.avaliacao-nota[aria-pressed="true"] span{color:var(--texto)}
.avaliacao-nota.boa[aria-pressed="true"]{border-color:var(--verde);background:var(--verde-fundo)}
.avaliacao-nota.boa[aria-pressed="true"] .icone{color:var(--verde)}
.avaliacao-nota.regular[aria-pressed="true"]{border-color:var(--amarelo);background:rgba(245,217,78,.08)}
.avaliacao-nota.regular .icone{color:var(--amarelo)}
.avaliacao-nota.boa .icone{color:var(--verde)}
.avaliacao-nota.ruim .icone{color:var(--restricao)}
.avaliacao-nota.ruim[aria-pressed="true"]{border-color:var(--restricao);background:var(--restricao-fundo)}
.avaliacao-nota.ruim[aria-pressed="true"] .icone{color:var(--restricao)}
@keyframes escolher{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}

.marcas{display:flex;flex-wrap:wrap;gap:9px}
.marca-tag{
  display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:8px 14px;
  background:var(--card);border:1px solid var(--linha);border-radius:var(--r-pill);
  font-size:11px;font-weight:500;color:var(--texto-2);cursor:pointer;
  transition:border-color var(--medio) var(--curva), color var(--medio) var(--curva),
             background var(--medio) var(--curva);
}
.marca-tag .icone{width:15px;height:15px;opacity:0;transition:opacity var(--rapido) var(--curva)}
.marca-tag:hover{border-color:var(--linha-2);color:var(--texto)}
.marca-tag[aria-pressed="true"]{border-color:var(--amarelo);color:var(--amarelo);background:rgba(245,217,78,.09)}
.marca-tag[aria-pressed="true"] .icone{opacity:1;color:var(--amarelo)}
.marca-tag:focus-visible{outline:2px solid var(--vermelho-alto);outline-offset:2px}

/* ---------- progresso ---------- */
/* Grade de cinco colunas com trilho de altura fixa: em flex, coluna sem barra
   colapsava e cada dia acabava com uma altura diferente. */
.semana{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;
  background:var(--card);border:1px solid var(--linha);border-radius:var(--r-card);padding:20px 16px}
.dia{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
.dia .valor-dia{font-size:11px;font-weight:600;line-height:18px;color:var(--texto-2);font-variant-numeric:tabular-nums}
.dia .trilho{width:70%;height:94px;border-radius:10px;background:transparent;
  display:flex;align-items:flex-end;overflow:hidden}
.dia .barra{width:100%;border-radius:10px;background:linear-gradient(180deg,var(--vermelho-alto),var(--vermelho));
  transition:height var(--lento) var(--curva)}
.dia .sigla{font-size:11px;font-weight:700;color:var(--texto-3);letter-spacing:.04em}
.dia.hoje .barra{background:linear-gradient(180deg,var(--amarelo-alto),var(--amarelo))}
.dia.hoje .sigla{color:var(--texto)}
.dia.hoje .trilho{outline:0}
.dia.sem-registro .barra{background:transparent}

.metricas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metrica{background:var(--card);border:1px solid var(--linha);border-radius:var(--r-card);padding:14px;box-shadow:var(--sombra)}
.metrica .topo-m{display:flex;align-items:center;gap:9px;color:var(--texto-2)}
.metrica .topo-m .icone{width:16px;height:16px}
.metrica .topo-m span{font-size:11.5px;font-weight:600;line-height:1.3}
.metrica b{display:block;font-size:22px;font-weight:800;margin-top:10px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.metrica em{display:block;font-size:11.5px;color:var(--texto-3);font-style:normal;margin-top:5px}

/* ---------- perfil ---------- */
.perfil-topo{display:flex;align-items:center;gap:14px;padding:10px 0}
.avatar{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,#77808D,#424954);border:2px solid #858D99;color:#fff;font-size:24px;font-weight:700}

.perfil-topo .quem{min-width:0}
.perfil-topo .quem b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.perfil-topo .quem span{display:block;font-size:13px;color:var(--texto-2);margin-top:3px}

.campos{background:var(--card);border:1px solid var(--linha);border-radius:var(--r-card);overflow:hidden}
.campo{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:9px 13px;min-height:40px}
.campo + .campo{border-top:1px solid var(--linha)}
.campo dt{font-size:12px;color:var(--texto-2);flex:none}
.campo dd{margin:0;font-size:12px;font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}

.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-pill);padding:7px 13px;
  font-size:13px;font-weight:600;background:var(--restricao-fundo);color:var(--restricao)}
.tag .icone{width:14px;height:14px}
.tag.calma{background:var(--neutro-fundo);color:var(--texto-2)}

.interruptor{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;min-height:60px;
  background:var(--card);border:1px solid var(--linha);border-radius:var(--r-card);
  padding:13px 16px;cursor:pointer;transition:border-color var(--medio) var(--curva);
}
.interruptor:hover{border-color:var(--linha-2)}
.interruptor:focus-visible{outline:2px solid var(--vermelho-alto);outline-offset:2px}
.interruptor .txt{flex:1;min-width:0}
.interruptor .txt b{display:block;font-size:14px;font-weight:600}
.interruptor .txt span{display:block;font-size:12px;color:var(--texto-2);margin-top:2px;line-height:1.4}
.chave{width:46px;height:28px;border-radius:var(--r-pill);flex:none;background:var(--card-3);
  border:1px solid var(--linha-2);position:relative;transition:background var(--medio) var(--curva)}
.chave::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:var(--texto-3);transition:transform var(--medio) var(--curva), background var(--medio) var(--curva)}
.interruptor[aria-pressed="true"] .chave{background:var(--vermelho);border-color:var(--vermelho)}
.interruptor[aria-pressed="true"] .chave::after{transform:translateX(18px);background:#fff}

/* ---------- estados ---------- */
.esqueleto{border-radius:var(--r-card);background:linear-gradient(100deg,var(--card) 30%,var(--card-3) 50%,var(--card) 70%);
  background-size:220% 100%;animation:brilhar 1.25s linear infinite}
@keyframes brilhar{from{background-position:120% 0}to{background-position:-120% 0}}
.vazio{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:34px 20px;
  background:var(--card);border:1px dashed var(--linha-2);border-radius:var(--r-card)}
.vazio .icone{width:28px;height:28px;color:var(--texto-3)}
.vazio b{font-size:15px;font-weight:600}
.vazio span{font-size:13px;color:var(--texto-2);max-width:30ch;line-height:1.5}

.aviso{display:flex;gap:11px;align-items:flex-start;border-radius:var(--r-card);padding:13px 14px;
  font-size:13.5px;line-height:1.5;border:1px solid transparent}
.aviso .icone{margin-top:1px;width:18px;height:18px}
.aviso.blk{background:var(--restricao-fundo);color:var(--restricao);border-color:rgba(255,107,107,.22)}
.aviso.wrn{background:var(--laranja-fundo);color:var(--laranja);border-color:rgba(244,167,44,.22)}
.aviso.okk{background:var(--verde-fundo);color:var(--verde);border-color:rgba(69,212,144,.22)}
.aviso b{font-weight:700}

/* ---------- telas do bot (as que ainda saem do texto) ---------- */
.secao{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--texto-3);margin:22px 0 -4px}
.tela > .secao:first-child{margin-top:0}
.paragrafo{margin:0;font-size:var(--t-body);color:var(--texto)}
.paragrafo b{font-weight:700}
.nota{margin:0;font-size:13px;color:var(--texto-2);line-height:1.55}
.prosa{background:var(--card);border:1px solid var(--linha);border-radius:var(--r-card);padding:16px}
.prosa > * + *{margin-top:10px}
.passo{display:inline-flex;align-items:center;gap:8px;background:var(--card-2);border:1px solid var(--linha-2);
  border-radius:var(--r-pill);padding:7px 14px;font-size:13px;font-weight:700}
.linha{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:52px;
  background:var(--card);border:1px solid var(--linha);border-radius:var(--r-card);padding:12px 14px;font-size:14px}
.linha .medida{font-size:12px;font-weight:700;color:var(--texto);max-width:48%;text-align:right;
  background:var(--card-3);border-radius:var(--r-pill);padding:4px 11px}
.tabela{background:var(--card);border:1px solid var(--linha);border-radius:var(--r-card);padding:15px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.6;
  white-space:pre;overflow-x:auto;color:var(--texto-2)}
.opcao{display:flex;gap:12px;align-items:center;width:100%;text-align:left;min-height:56px;
  background:var(--card);border:1px solid var(--linha);border-radius:var(--r-card);padding:14px;
  font-size:14px;font-weight:600;cursor:pointer;transition:background var(--medio) var(--curva),border-color var(--medio) var(--curva)}
.opcao:hover{background:var(--card-2);border-color:var(--linha-2)}
.opcao:active{transform:scale(.98)}
.opcao:focus-visible{outline:2px solid var(--vermelho-alto);outline-offset:2px}
.opcao[disabled]{opacity:.5;cursor:default}
.opcao .caixa{width:20px;height:20px;border-radius:6px;flex:none;border:2px solid var(--texto-3);
  display:grid;place-items:center;color:transparent}
.opcao.marcada .caixa{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.opcao .caixa .icone{width:12px;height:12px;stroke-width:3}
.cabeca-tela{font-size:26px;font-weight:800;line-height:1.22;letter-spacing:-.03em}

/* ---------- acoes no rodape ---------- */
.acoes{flex:none;display:flex;flex-direction:column;gap:7px;padding:10px var(--pad);max-height:38dvh;overflow-y:auto;
  background:var(--card);border-top:1px solid var(--linha)}
.acoes > *{flex-shrink:0}
.acoes .cta{min-height:44px;padding:8px 14px;border-radius:11px}
.acoes .cta b{font-size:12px}
.acoes .cta > .icone{width:18px;height:18px}
.acoes .leve > .icone,.acoes .fantasma > .icone{color:var(--amarelo)}
.acoes:empty{display:none}
.acoes .anexo{background:transparent;border:1.5px dashed var(--vermelho-alto);color:var(--vermelho-alto)}
.acoes .anexo:hover{background:var(--restricao-fundo)}

/* ---------- navegacao inferior ---------- */
.abas{flex:none;display:flex;background:var(--fundo);border-top:1px solid var(--linha-2);padding:7px 8px 6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.aba{flex:1;min-width:0;min-height:55px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:7px 3px;background:transparent;border:0;cursor:pointer;font-size:10px;color:var(--texto-3)}
.aba .icone{width:21px;height:21px}
.aba[aria-current="page"]{color:var(--vermelho-alto);font-weight:700}
.aba[aria-current="page"]::after{content:"";height:3px;width:35px;position:absolute;bottom:-6px;left:calc(50% - 17.5px);background:var(--vermelho);border-radius:3px}
.aba:focus-visible{outline:2px solid var(--amarelo);outline-offset:-3px;border-radius:8px}

/* ---------- convite para instalar ---------- */
.instalar{flex:none;display:none;align-items:center;flex-wrap:wrap;gap:8px;background:var(--card-2);
  border-bottom:1px solid var(--linha);padding:12px var(--pad);font-size:13.5px;color:var(--texto)}
.instalar.on{display:flex}
.instalar p{margin:0;flex:1 1 160px;font-size:12px}
.instalar button{background:var(--card-3);color:var(--texto);border:0;border-radius:12px;
  padding:10px 15px;font-size:13px;font-weight:700;cursor:pointer;flex:none;min-height:44px}
.instalar .nao{background:none;color:var(--texto-3);font-weight:500;padding:10px 4px}

/* ---------- folha ---------- */
dialog{border:0;padding:0;background:transparent;max-width:100%;width:100%;margin:auto auto 0}
dialog::backdrop{background:rgba(0,0,0,.72)}
.folha::before{content:"";display:block;width:36px;height:4px;background:var(--linha-2);border-radius:9px;margin:-10px auto 22px}
.folha{background:var(--card);color:var(--texto);border:1px solid var(--linha-2);
  border-radius:24px 24px 0 0;padding:24px var(--pad);
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  max-width:480px;margin:0 auto;max-height:86dvh;overflow-y:auto}
.folha h2{font-size:var(--t-h2);margin-bottom:6px}
.folha h3{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--texto-3);margin:22px 0 9px}
.folha p{margin:0 0 10px;font-size:14px;color:var(--texto-2);line-height:1.55}
.folha dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:0;font-size:14px}
.folha dt{color:var(--texto-3)}
.folha dd{margin:0}
.folha .fechar{width:100%;margin-top:22px;background:var(--amarelo);color:var(--amarelo-ink);
  border:0;border-radius:var(--r-btn);padding:15px;font-weight:700;cursor:pointer;font-size:15px;min-height:var(--h-cta)}
.estados{display:flex;flex-direction:column;gap:8px}
.estado{display:flex;gap:11px;align-items:center;font-size:13.5px;padding:11px 13px;border-radius:12px}
.estado b{white-space:nowrap;font-weight:700}
.estado.blk{background:var(--restricao-fundo);color:var(--restricao)}
.estado.wrn{background:var(--laranja-fundo);color:var(--laranja)}
.estado.okk{background:var(--verde-fundo);color:var(--verde)}
.estado span{color:var(--texto-2)}

/* ---------- marca no rodape ---------- */
.assinatura{text-align:center;padding:24px 0 8px}
.assinatura .nome{color:var(--texto-2);font-size:20px;font-weight:800;letter-spacing:-.03em}
.assinatura .nome i{color:var(--amarelo);font-style:normal}
.assinatura p{margin:5px 0 0;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--texto-3)}

@media (max-width:359px){
  :root{--pad:14px;--t-h1:23px}
  .conquistas{padding:13px}
  .conq-corpo{gap:9px}
  .conq-item{font-size:11px;gap:6px}
  .pontos{width:85px}
  .anel{width:81px;height:81px}
  .conq-topo h2{font-size:15px}
  .filtros{gap:5px}
  .filtro{font-size:10px;padding:6px 7px}
  .foto-prato{width:48px;height:48px}
  .prato-resumo .foto-prato{width:95px;height:95px}
  .prato-resumo .macros > b{font-size:20px}
  .resumo-progresso{gap:10px}
}

@media (min-width:600px){
  body{background:radial-gradient(ellipse at 50% 0%,#242025,#090A0C 65%)}
  .app{height:min(940px,calc(100dvh - 48px));margin:24px auto;border:1px solid var(--linha-2);
    border-radius:30px;box-shadow:0 24px 80px rgba(0,0,0,.45)}
  dialog{margin:auto;width:min(480px,calc(100% - 40px))}
  .folha{border-radius:24px}
}

@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>

  <symbol id="i-estrela-cheia" viewBox="0 0 24 24"><path d="M12 2.6l2.8 5.7 6.3.9-4.6 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.2l6.3-.9L12 2.6Z"/></symbol>

<script>
(function(){
  "use strict";

  var TELAS = {}, DADOS = null, historico = [], atual = "inicio";
  var tela = document.getElementById("tela");
  var acoes = document.getElementById("acoes");
  var abas = document.getElementById("abas");
  var topo = document.getElementById("topo");
  // A previa pode trazer a home ja montada para leitores sem JavaScript.
  // Ao iniciar o app, a navegacao volta a ser criada pelo codigo abaixo.
  abas.textContent = "";

  // O que a pessoa mexeu nesta sessao. Fica so na memoria: e demonstracao, e
  // dizer que gravou no servidor seria mentir sobre o que aconteceu.
  var estado = {
    nota: null, faltas: [], avaliado: false,
    registrado: false, pontos: 0, conquistaNova: null, gestao: false,
    filtroCardapio: "todos", periodoProgresso: "semana"
  };
  try { estado.gestao = localStorage.getItem("apetit-gestao") === "sim"; } catch (e) {}

  var ABAS = [
    { id: "inicio",    icone: "i-casa",       nome: "Início" },
    { id: "cardapio",  icone: "i-talher",     nome: "Cardápio" },
    { id: "progresso", icone: "i-barras",     nome: "Progresso" },
    { id: "perfil",    icone: "i-pessoa",     nome: "Perfil" }
  ];

  var ACOMPANHAMENTO = [
    { id: "ficha", nome: "Minha ficha nutricional", busca: "Minha ficha", icone: "i-ficha" },
    { id: "meu_dia", nome: "Meu dia", busca: "Meu dia", icone: "i-prancheta" },
    { id: "favoritos", nome: "Alimentos preferidos", busca: "Favoritos", icone: "i-coracao" },
    { id: "avisos", nome: "Notificações", busca: "Avisos", icone: "i-sino" },
    { id: "ajuda", nome: "Ajuda", busca: "Ajuda", icone: "i-ajuda" }
  ];

  // "Avaliacao do refeitorio" virou "Resultados das avaliacoes": o funcionario
  // ja tem uma acao chamada "Avaliar o refeitorio", e dois nomes quase iguais
  // para coisas opostas — uma escreve, a outra le — confundem quem administra.
  var ADMIN = [
    { id: "piloto",      icone: "i-trofeu",  nome: "Relatório do piloto", detalhe: "Visão geral e indicadores" },
    { id: "relatorio",   icone: "i-grupo",   nome: "Adesão por setor", detalhe: "Participação agregada" },
    { id: "atendimento", icone: "i-estrela", nome: "Resultados das avaliações", detalhe: "Satisfação e pontos de melhoria" },
    { id: "cobertura",   icone: "i-escudo",  nome: "Cobertura de alergênicos", detalhe: "Informação e segurança" }
  ];

  // Categoria do cardapio -> icone. Sem entrada, o prato usa o talher generico:
  // desenho errado ensina a desconfiar do desenho certo.
  var ICONE_CATEGORIA = {
    "PRATO PRINCIPAL": "i-talher", "OPCAO AO PP": "i-talher",
    "GUARNICAO": "i-pao", "ARROZ": "i-tigela", "FEIJAO": "i-tigela",
    "SALADA": "i-folha", "FRUTA": "i-folha",
    "SOBREMESA": "i-gota", "BEBIDA": "i-gota"
  };

  // ---------- utilitarios ----------
  var PERMITIDAS = /^\/?(b|i|u|s|code|em|strong)$/i;
  function escapar(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function inline(texto){
    var saida = "", resto = String(texto), re = /<([^>]{1,12})>/g, m, fim = 0;
    while ((m = re.exec(resto)) !== null){
      saida += escapar(resto.slice(fim, m.index));
      saida += PERMITIDAS.test(m[1]) ? "<" + m[1] + ">" : escapar(m[0]);
      fim = m.index + m[0].length;
    }
    return saida + escapar(resto.slice(fim));
  }
  function semTags(t){ return String(t).replace(/<[^>]{1,12}>/g, "").trim(); }
  function semEmoji(t){
    return String(t)
      .replace(/[←-⇿⌀-➿⬀-⯿️‍]/g, "")
      .replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, "")
      .replace(/\s{2,}/g, " ").trim();
  }
  function el(tag, classe, html){
    var n = document.createElement(tag);
    if (classe) n.className = classe;
    if (html != null) n.innerHTML = html;
    if (tag === "button") n.type = "button";
    return n;
  }
  function icone(nome, classe){
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("class", "icone " + (classe || ""));
    s.setAttribute("aria-hidden", "true");
    var u = document.createElementNS("http://www.w3.org/2000/svg", "use");
    u.setAttribute("href", "#" + nome);
    s.appendChild(u);
    return s;
  }
  function chip(nome, calmo){
    var c = el("span", "chip" + (calmo ? " calmo" : ""));
    c.appendChild(icone(nome));
    return c;
  }
  function selo(texto, cor, ic){
    var s = el("span", "selo-tag" + (cor ? " " + cor : ""));
    if (ic) s.appendChild(icone(ic));
    s.appendChild(el("span", "", escapar(texto)));
    return s;
  }
  function botaoIcone(ic, rotulo, aoClicar){
    var b = el("button", "crculo");
    b.setAttribute("aria-label", rotulo);
    b.appendChild(icone(ic));
    b.addEventListener("click", aoClicar);
    return b;
  }
  // Contador que anda ate o numero em vez de pular. Respeita quem pediu menos
  // animacao no sistema.
  function contarAte(no, de, ate){
    var reduz = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduz || de === ate){ no.textContent = String(ate); return; }
    var inicio = performance.now(), dur = 620;
    (function passo(agora){
      var t = Math.min(1, (agora - inicio) / dur);
      var suave = 1 - Math.pow(1 - t, 3);
      no.textContent = String(Math.round(de + (ate - de) * suave));
      if (t < 1) requestAnimationFrame(passo);
    })(inicio);
  }

  var VEREDITO = {
    "⛔": { classe: "blk", icone: "i-proibido" },
    "⚠️": { classe: "wrn", icone: "i-atencao" },
    "✅": { classe: "okk", icone: "i-liberado" }
  };
  var COR = { bloqueio: "vermelho", atencao: "laranja", liberado: "verde" };
  var ICONE_VEREDITO = { bloqueio: "i-proibido", atencao: "i-atencao", liberado: "i-liberado" };

  var DO_ROTULO = [
    [/\u{1F4CE}/u, "i-clipe"], [/✍/u, "i-lapis"], [/\u{1F4C5}/u, "i-calendario"],
    [/\u{1F957}/u, "i-tigela"], [/\u{1F37D}/u, "i-talher"], [/⭐/u, "i-estrela"],
    [/\u{1F4C8}/u, "i-tendencia"], [/\u{1F4CB}/u, "i-ficha"], [/\u{1F4CA}/u, "i-barras"],
    [/\u{1F464}/u, "i-pessoa"], [/\u{1F514}/u, "i-sino"], [/❓/u, "i-ajuda"],
    [/➡/u, "i-pular"], [/✋/u, "i-mao"], [/✅/u, "i-liberado"],
    [/\u{1F519}/u, "i-voltar"], [/\u{1F3C6}/u, "i-trofeu"], [/\u{1F4C4}/u, "i-arquivo"],
    [/\u{1F512}/u, "i-cadeado"], [/\u{1F5D1}/u, "i-proibido"]
  ];
  function iconeDoRotulo(rotulo){
    for (var i = 0; i < DO_ROTULO.length; i++){
      if (DO_ROTULO[i][0].test(rotulo)) return DO_ROTULO[i][1];
    }
    return "";
  }

  // ---------- a tela do bot lida como estrutura ----------
  //
  // Cinco telas ja sao nativas e saem de `dados.json`. As outras setenta —
  // montar o prato, a ficha, os favoritos, os relatorios — continuam saindo do
  // texto que o bot escreve, lido em blocos. Reescrever as setenta a mao seria
  // trocar conteudo verdadeiro por conteudo mantido em dois lugares.
  var PRATO_TXT = /^(⛔|⚠️|✅|⬜|☑️)\s+([^<].*?)\s+—\s+<i>(.*?)<\/i>\s*(.*)$/;
  var MARCADO = /^(⛔|⚠️|✅)\s+(.*)$/;
  var DETALHE = /^\s{2,}<b>(.*)<\/b>\s*$/;
  var CABECA  = /^(\S*)\s*<b>(.*?)<\/b>\s*$/;
  var PORCAO  = /^•\s+(\d+)\s+(\S+)\s+de\s+(.+)$/;
  var VONTADE = /^•\s+(.+?)\s+(?:a|à)\s+vontade$/i;
  var ITEM    = /^•\s+(.+)$/;
  var MEDIDA  = /^(.+?)\s+—\s+(.+)$/;

  function blocos(texto){
    var linhas = String(texto).split("\n"), saida = [], i, m;
    for (i = 0; i < linhas.length; i++){
      var linha = linhas[i];
      if (!linha.trim()) continue;

      m = DETALHE.exec(linha);
      if (m && saida.length && saida[saida.length - 1].tipo === "prato"){
        saida[saida.length - 1].porque = m[1];
        continue;
      }
      m = PRATO_TXT.exec(linha);
      if (m){
        var v = VEREDITO[m[1]] || VEREDITO[(m[4] || "").trim()] ||
                { classe: "neutro", icone: "i-talher" };
        saida.push({ tipo: "prato", estado: v.classe, simbolo: v.icone,
                     nome: m[2], dica: m[3], porque: "" });
        continue;
      }
      m = MARCADO.exec(linha);
      if (m){
        if (/^=/.test(m[2])){ saida.push({ tipo: "nota", texto: semEmoji(m[1] + " " + m[2]) }); continue; }
        saida.push({ tipo: "aviso", estado: VEREDITO[m[1]].classe,
                     simbolo: VEREDITO[m[1]].icone, texto: m[2] });
        continue;
      }
      m = PORCAO.exec(linha);
      if (m){ saida.push({ tipo: "linha", nome: m[3], medida: m[1] + " " + m[2] }); continue; }
      m = VONTADE.exec(linha);
      if (m){ saida.push({ tipo: "linha", nome: m[1], medida: "à vontade" }); continue; }
      m = ITEM.exec(linha);
      if (m){
        var partes = MEDIDA.exec(m[1]);
        saida.push(partes ? { tipo: "linha", nome: partes[1], medida: partes[2] }
                          : { tipo: "linha", nome: m[1], medida: "" });
        continue;
      }
      if (/^<b>Passo /.test(linha)){ saida.push({ tipo: "passo", texto: linha }); continue; }

      m = CABECA.exec(linha);
      if (m && (!saida.length || !/[.!?]$/.test(semTags(m[2])))){
        saida.push({ tipo: saida.length ? "secao" : "titulo", texto: m[2] });
        continue;
      }
      if (/^<i>[\s\S]*<\/i>$/.test(linha.trim())){
        saida.push({ tipo: "nota", texto: linha.trim().slice(3, -4) });
        continue;
      }
      saida.push({ tipo: "paragrafo", texto: linha });
    }
    return saida;
  }

  function chave(texto){
    return semTags(texto).replace(/^[^0-9A-Za-zÀ-ÿ]+/, "").trim().toLowerCase();
  }

  function pratoDoTexto(b, escolha){
    var no = el(escolha ? "button" : "div", "prato " + b.estado);
    if (escolha){
      if (vivo(escolha)) no.addEventListener("click", function(){ mostrar(escolha.destino); });
      else no.disabled = true;
    }
    no.appendChild(icone(b.simbolo));
    var corpo = el("div", "corpo");
    corpo.appendChild(el("div", "nome", inline(b.nome)));
    if (b.dica) corpo.appendChild(el("div", "papel", inline(b.dica)));
    if (b.porque){
      var selos = el("div", "selos");

  function desenhar(bs, destino, escolhas){
    var pilha = null, prosa = null;
    function por(no, agrupavel){
      if (agrupavel){
        if (!prosa){ prosa = el("div", "prosa"); destino.appendChild(prosa); }
        prosa.appendChild(no);
        return;
      }
      destino.appendChild(no);
    }
    bs.forEach(function(b){
      if (b.tipo !== "linha") pilha = null;
      if (b.tipo !== "paragrafo" && b.tipo !== "nota") prosa = null;

      if (b.tipo === "titulo") return;
      if (b.tipo === "secao"){ por(el("p", "secao", inline(b.texto))); return; }
      if (b.tipo === "nota"){ por(el("p", "nota", inline(b.texto)), true); return; }
      if (b.tipo === "paragrafo"){ por(el("p", "paragrafo", inline(b.texto)), true); return; }
      if (b.tipo === "passo"){
        var caixa = el("div", "");
        caixa.appendChild(el("span", "passo", inline(b.texto)));
        por(caixa);
        return;
      }
      if (b.tipo === "aviso"){
        var aviso = el("div", "aviso " + b.estado);
        aviso.appendChild(icone(b.simbolo));
        aviso.appendChild(el("span", "", inline(b.texto)));
        por(aviso);
        return;
      }
      if (b.tipo === "prato"){
        var escolha = escolhas && escolhas[chave(b.nome)];
        if (escolha) escolha.usado = true;
        por(pratoDoTexto(b, escolha && escolha.botao));
        return;
      }
      if (b.tipo === "linha"){
        if (!pilha){ pilha = el("div", "pilha"); destino.appendChild(pilha); }
        var linha = el("div", "linha");
        linha.appendChild(el("span", "", inline(b.nome)));
        if (b.medida) linha.appendChild(el("span", "medida", inline(b.medida)));
        pilha.appendChild(linha);
      }
    });
    destino.querySelectorAll(".prosa").forEach(function(c){
      if (c.childElementCount < 2) c.classList.remove("prosa");
    });
  }

  function noMenu(rotulo){
    var botoes = (TELAS.inicio || {}).botoes || [], i;

  function classificar(botoes){
    var out = { opcoes: [], acoes: [] };
    (botoes || []).forEach(function(b){
      if (/voltar/i.test(b.rotulo)) return;
      if (/^(pick:|aval_|aviso:|fav_)/.test(b.acao || "")){ out.opcoes.push(b); return; }
      if (/^(⬜|☑️)/.test(b.rotulo)){ out.opcoes.push(b); return; }
      if (noMenu(b.rotulo)) return;
      out.acoes.push(b);
    });

  }

  function serieProgresso(periodo){
    if(periodo === "semana") return ((DADOS && DADOS.semana) || []).map(function(d){
      return d.hoje && estado.registrado ? Object.assign({},d,{registrado:true,kcal:DADOS.porcoes.kcal}) : d;
    });
    var dia=(DADOS && DADOS.dia) || "", hoje=new Date(dia + "T12:00:00Z");
    if(!isFinite(hoje.getTime())) return [];
    var dias=(((DADOS || {}).meu_dia || {}).dias || []).slice();
    if(estado.registrado) dias.push({data:dia,kcal:DADOS.porcoes.kcal});
    var mensal=periodo === "mes", numero=mensal ? 5 : 12, partes=[];
    for(var n=0;n<numero;n++){
      var inicio, fim;
      if(mensal){
        inicio=new Date(hoje);inicio.setUTCDate(inicio.getUTCDate()-29+n*6);
        fim=new Date(inicio);fim.setUTCDate(fim.getUTCDate()+6);
      }else{
        inicio=new Date(Date.UTC(hoje.getUTCFullYear(),hoje.getUTCMonth()-11+n,1,12));
        fim=new Date(Date.UTC(inicio.getUTCFullYear(),inicio.getUTCMonth()+1,1,12));
      }
      var a=inicio.toISOString().slice(0,10),b=fim.toISOString().slice(0,10);
      var achados=dias.filter(function(d){return d.data >= a && d.data < b && d.data <= dia;});
      partes.push({sigla:mensal ? String(inicio.getUTCDate()).padStart(2,"0") : ["J","F","M","A","M","J","J","A","S","O","N","D"][inicio.getUTCMonth()],
        hoje:n===numero-1,registrado:achados.length > 0,kcal:achados.reduce(function(s,d){return s+(d.kcal || 0);},0)});
    }
    return partes;
  }

  function alvoDeRotulo(texto){

    grade.style.marginTop="22px";
    ADMIN.forEach(function(a){
      if(!TELAS[a.id]) return;
      var b=el("button","item");
      b.appendChild(chip(a.icone));
      b.appendChild(el("span","item-texto","<b>"+escapar(a.nome)+"</b><small>"+escapar(a.detalhe)+"</small>"));
      b.appendChild(icone("i-seta","seta"));
      b.addEventListener("click",function(){mostrar(a.id);});
      grade.appendChild(b);
    });
    tela.appendChild(grade);
    tela.appendChild(el("p","gestao-nota","Nenhum funcionário é identificado nominalmente nos relatórios. Refeições e metas individuais não aparecem. Recortes com menos de cinco pessoas são suprimidos."));
  }

  function telaEstados(){
    cabecalhoInterno("Apetit", "Demonstração de componentes");
    tela.appendChild(el("h1","h1","Estados da interface"));
    tela.appendChild(el("p","sub","Exemplos de componentes e feedbacks."));
    [["Carregando","loading","i-atualizar","Carregando…",""],
     ["Vazio","","i-calendario","Nenhum registro ainda.","Suas informações aparecerão aqui."],
     ["Erro","erro","i-atencao","Não foi possível carregar o cardápio.","Verifique a conexão e tente novamente."],
     ["Sucesso","sucesso","i-liberado","Refeição registrada com sucesso!","Seu progresso foi atualizado."],
     ["Offline","erro","i-info","Você está offline.","Algumas funcionalidades podem não estar disponíveis."]
    ].forEach(function(e){
      tela.appendChild(el("h2","h2",e[0]));
      var card=el("div","estado-exemplo "+e[1]);
      var ic=el("span","estado-icone");ic.appendChild(icone(e[2]));card.appendChild(ic);
      card.appendChild(el("div","","<b>"+e[3]+"</b>"+(e[4]?"<p>"+e[4]+"</p>":"")));
      tela.appendChild(card);
    });
  }

  var NATIVAS = {
    inicio: telaInicio, cardapio: telaCardapio, quanto: telaQuanto,
    avaliar: telaAvaliar, progresso: telaProgresso, perfil: telaPerfil,
    gestao: telaGestao, estados: telaEstados
  };


  // ---------- navegacao ----------
  //
  // O crawler do bot separa estados da mesma tela com sufixo ("progresso_",
  // "quanto__"). Cinco troncos agora tem tela nativa, e qualquer sufixo deles
  // cai na nativa: o botao capturado do bot continua funcionando, e a pessoa
  // chega na tela boa em vez de na transcricao.
  var TRONCOS = ["cardapio", "quanto", "avaliar", "progresso", "perfil"];

  function destinoReal(id){
    if (NATIVAS[id]) return id;
    for (var i = 0; i < TRONCOS.length; i++){
      if (id.indexOf(TRONCOS[i]) === 0) return TRONCOS[i];
    }
    // "aval_comida:3" e o clique de nota no bot; a avaliacao agora e nativa.
    if (/^aval_/.test(id)) return "avaliar";
    return id;
  }

  function mostrar(id, guardar){
    var alvo = destinoReal(id);
    var nativa = NATIVAS[alvo];
    var t = TELAS[alvo];
    if (!nativa && !t) return;
    if (guardar !== false && atual !== alvo) historico.push(atual);
    atual = alvo;

    tela.textContent = "";
    acoes.textContent = "";
    tela.classList.remove("entrando");
    void tela.offsetWidth;
    tela.classList.add("entrando");

    if (nativa){
      nativa();
    } else if (t.grupo === "administracao"){
      cabecalhoInterno("Visão da Apetit", "agregado · sem nomes");
      tela.appendChild(el("p", "nota", "Número agregado, nunca pessoa."));
      tela.appendChild(el("div", "tabela", inline(semEmoji(t.texto))));
    } else {
      telaDoBot(t);
    }

    marcarAba(alvo);
    tela.scrollTop = 0;
    tela.focus({ preventScroll: true });
  }

  function redesenhar(){ mostrar(atual, false); }

  function telaDoBot(t){
    var anexo = t.arquivo || (t.caminho || []).slice(-1)[0] === "__anexar_pdf__";
    if (anexo){
      var faixa = el("div", "aviso okk");
      faixa.appendChild(icone("i-arquivo"));
      faixa.appendChild(el("span", "",
        "<b>" + escapar(t.arquivo || "ficha_nutricionista.pdf") + "</b> — enviado"));
      tela.appendChild(faixa);
    }

    var bs = blocos(t.texto);
    var grupos = classificar(t.botoes);
    var escolhas = {};
    grupos.opcoes.forEach(function(b){ escolhas[chave(b.rotulo)] = { botao: b, usado: false }; });

    desenhar(bs, tela, escolhas);

    var sobraram = grupos.opcoes.filter(function(b){ return !escolhas[chave(b.rotulo)].usado; });
    if (sobraram.length){
      var caixa = el("div", "pilha");
      sobraram.forEach(function(b){ caixa.appendChild(opcao(b)); });
      tela.appendChild(caixa);
    }

    var temEscolha = grupos.opcoes.length > 0;
    grupos.acoes.forEach(function(b, n){
      acoes.appendChild(acao(b, !temEscolha && n === 0 && vivo(b)));
    });

    var cabeca = bs.filter(function(b){ return b.tipo === "titulo"; })[0];
    var nome = cabeca ? semEmoji(semTags(cabeca.texto)) : "";
    var data = DADOS ? DADOS.dia_amigavel : "";
    if (nome.length > 22){
      tela.insertBefore(el("h1", "cabeca-tela", escapar(nome)), tela.firstChild);
      cabecalhoInterno("Apetit", nome === data ? "" : data);
    } else {
      cabecalhoInterno(nome || "Apetit", nome === data ? "" : data);
    }
  }

  function abaDe(id){
    if (id === "inicio") return "inicio";
    if (/^(montar|pick:|quanto|cardapio)/.test(id)) return "cardapio";
    if (/^(ficha|perfil|avisos|aviso:|favoritos|gestao)/.test(id)) return "perfil";
    var achou = "";
    ABAS.forEach(function(a){
      if (a.id !== "inicio" && id.indexOf(a.id) === 0) achou = a.id;
    });
    return achou;
  }

  function marcarAba(id){
    var ativa = abaDe(id);
    abas.querySelectorAll(".aba").forEach(function(a){
      if (a.dataset.aba === ativa) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }

  ABAS.forEach(function(a){
    var b = el("button", "aba");
    b.dataset.aba = a.id;
    b.appendChild(icone(a.icone));
    b.appendChild(el("span", "", escapar(a.nome)));
    b.addEventListener("click", function(){
      var alvo = alvoDe(a);
      if (!alvo) return;
      historico.length = 0;
      mostrar(alvo, a.id !== "inicio");
    });
    abas.appendChild(b);
  });


  // ---------- instalar na tela inicial ----------
  var faixaInstalar = document.getElementById("faixa-instalar");
  var btnInstalar = document.getElementById("btn-instalar");
  var textoInstalar = document.getElementById("instalar-texto");
  var evtInstalar = null;

  function jaInstalado(){
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.navigator.standalone === true;
  }
  function guardou(){
    try { return localStorage.getItem("apetit-instalar") === "nao"; } catch (e) { return false; }
  }

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    evtInstalar = e;
    if (!jaInstalado() && !guardou()) faixaInstalar.classList.add("on");
  });

  btnInstalar.addEventListener("click", function(){
    if (evtInstalar){
      evtInstalar.prompt();
      evtInstalar.userChoice.then(function(){ evtInstalar = null; faixaInstalar.classList.remove("on"); });
    }
  });
  document.getElementById("btn-depois").addEventListener("click", function(){
    faixaInstalar.classList.remove("on");
    try { localStorage.setItem("apetit-instalar", "nao"); } catch (e) {}
  });

  // O iPhone nao dispara beforeinstallprompt: la a instalacao e manual, e a
  // unica coisa util que o app pode fazer e dizer onde fica o botao.
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !jaInstalado() && !guardou()){
    textoInstalar.innerHTML = "Para instalar: toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.";
    btnInstalar.style.display = "none";
    faixaInstalar.classList.add("on");
  }

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){ /* segue sem offline */ });
    });
  }



  // ---------- ler a ficha que a pessoa anexar ----------
  //
  // O bot le PDF em Python. Aqui, para a pessoa poder testar com a ficha dela
  // sem o bot no ar, a mesma leitura roda no navegador — e as regras vem de
  // `regras.json`, gerado do proprio `apetit/prescription.py`. Duplicar regex
  // em dois idiomas seria o caminho mais curto para as duas leituras
  // discordarem justamente no documento de alguem.
  var REGRAS = (window.__APETIT__ || {}).regras || null;
  if (!REGRAS){
    fetch("regras.json").then(function(r){ return r.json(); })
      .then(function(d){ REGRAS = d; }).catch(function(){ /* segue sem anexo */ });
  }

  function re(padrao, flags){
    // Python nomeia grupo com (?P<x>...); JS usa (?<x>...).
    return new RegExp(String(padrao).replace(/\(\?P</g, "(?<"), flags || "");
  }

  async function lerPdf(arquivo){
    if (!window.pdfjsLib) throw new Error("leitor-indisponivel");
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    var buffer = await arquivo.arrayBuffer();
    var pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    var partes = [];
    for (var n = 1; n <= pdf.numPages; n++){
      var pagina = await pdf.getPage(n);
      var conteudo = await pagina.getTextContent();
      // Um item por linha aproxima o que o pypdf devolve, que e o formato que
      // as regras esperam.
      partes.push(conteudo.items.map(function(i){ return i.str; }).join("\n"));
    }
    return partes.join("\n");
  }

  function planoDoTexto(texto){
    if (!REGRAS) return [];
    texto = texto.replace(re(REGRAS.rodape, "gs"), "\n");
    var cabecalho = re("^\\s*" + REGRAS.refeicoes + "\\s*$", "gmi");
    var marcas = [], m;
    while ((m = cabecalho.exec(texto)) !== null){
      marcas.push({ nome: m[1], inicio: m.index, fim: cabecalho.lastIndex });
    }
    var almoco = null;
    for (var i = 0; i < marcas.length; i++){
      if (!/almo[çc]o/i.test(marcas[i].nome)) continue;
      var ate = (i + 1 < marcas.length) ? marcas[i+1].inicio : texto.length;
      almoco = texto.slice(marcas[i].fim, ate);
      break;
    }
    if (almoco === null) return [];
    var corte = almoco.indexOf("•");
    return itensDoBloco(corte > 0 ? almoco.slice(0, corte) : almoco);
  }

  function itensDoBloco(bloco){
    bloco = bloco.replace(/\s*\n\s*/g, " ").trim();
    var ancora = re(REGRAS.ancora, "gi");
    var quantidade = re(REGRAS.quantidade, "s");
    var itens = [], pos = 0, m;
    while ((m = ancora.exec(bloco)) !== null){
      var trecho = bloco.slice(pos, m.index).trim();
      pos = ancora.lastIndex;
      if (!trecho) continue;

      var nome = trecho, qtd = null, medida = "";
      var partido = quantidade.exec(trecho);
      if (partido && partido.groups && partido.groups.nome.trim()){
        nome = partido.groups.nome.trim();
        qtd = partido.groups.qtd;
        medida = partido.groups.medida.trim();
      }
      var peso = "";
      if (m[3]){ medida = "a vontade"; qtd = null; }
      else if (m[1]){ peso = m[1] + " " + m[2].toLowerCase(); }
      else if (m[4]){ peso = m[4] + " ml"; }

      nome = nome.replace(/^[\s\-•]+|[\s\-•]+$/g, "");
      if (nome) itens.push({ nome: nome, qtd: qtd, medida: medida, peso: peso });
    }
    return itens;
  }

  function medidaDe(item){
    if (item.medida === "a vontade") return "à vontade";
    var partes = [];
    if (item.qtd) partes.push((item.qtd + " " + item.medida).trim());
    else if (item.medida) partes.push(item.medida);
    if (item.peso) partes.push("(" + item.peso + ")");
    return partes.join(" ");
  }

  function telaDoPlano(itens, nomeArquivo){
    var linhas = itens.map(function(i){
      var medida = medidaDe(i);
      return "• " + i.nome + (medida ? " — " + medida : "");
    }).join("\n");
    TELAS.__minha_ficha__ = {
      texto: "<b>Seu nutricionista pediu isso no almoço</b>\n" +
        "<i>Confira antes de valer.</i>\n\n" + linhas + "\n\n" +
        "<i>Sua ficha é um plano alimentar: ela lista alimento e medida, não " +
        "caloria. Vou usar essa lista para te mostrar o que mais se parece com " +
        "ela no cardápio de hoje.</i>\n" +
        "<i>O documento não fica guardado — só esta lista.</i>",
      grupo: "", caminho: ["__minha_ficha__"], arquivo: nomeArquivo,
      botoes: [
        { rotulo: "✅ É isso, pode guardar", acao: "ficha_ok", destino: "ficha_ok" },
        { rotulo: "📎 Anexar outra ficha", acao: "__anexar_meu__", destino: "" },
        { rotulo: "🔙 Voltar", acao: "ficha", destino: "ficha" }
      ]
    };
    mostrar("__minha_ficha__");
  }

  function telaDeAviso(tituloAviso, corpo){
    TELAS.__aviso_ficha__ = {
      texto: "<b>" + tituloAviso + "</b>\n\n" + corpo,
      grupo: "", caminho: ["__aviso_ficha__"],
      botoes: [
        { rotulo: "📎 Tentar outro arquivo", acao: "__anexar_meu__", destino: "" },
        { rotulo: "✍️ Digitar os números", acao: "ficha_manual", destino: "ficha_manual" },
        { rotulo: "🔙 Voltar", acao: "ficha", destino: "ficha" }
      ]
    };
    mostrar("__aviso_ficha__");
  }

  var entrada = document.getElementById("arquivo-pdf");
  entrada.addEventListener("change", async function(){
    var arquivo = entrada.files && entrada.files[0];
    entrada.value = "";
    if (!arquivo) return;

    telaDeAviso("Lendo " + arquivo.name + "…", "Só um instante.");
    try {
      var texto = await lerPdf(arquivo);
      var itens = planoDoTexto(texto);
      if (itens.length){ telaDoPlano(itens, arquivo.name); return; }
      telaDeAviso(
        "Não achei um almoço nessa ficha",
        "Eu procuro uma seção de <b>Almoço</b> com os alimentos e as medidas.\n\n" +
        "Se a ficha for foto ou digitalização, o arquivo tem a imagem do texto e " +
        "não o texto — eu não tento adivinhar letra de imagem, porque errar aqui " +
        "vira orientação errada a partir de um documento clínico.\n\n" +
        "Nesse caso, digite os números."
      );
    } catch (erro) {
      telaDeAviso(
        "Não consegui abrir esse arquivo",
        erro && erro.message === "leitor-indisponivel"
          ? "O leitor de PDF não carregou aqui. Use o exemplo pronto para ver o " +
            "caminho, ou digite os números."
          : "Ele pode estar protegido por senha ou corrompido. Tente outro arquivo " +
            "ou digite os números."
      );
    }
  });



  // ---------- estados de carga ----------
  function esqueleto(){
    cabecalhoInicio();
    tela.textContent = "";
    [188, 58, 58, 22, 64, 64].forEach(function(altura, n){
      var bloco = el("div", "esqueleto");
      bloco.style.height = altura + "px";
      bloco.style.marginTop = n ? "14px" : "0";
      if (altura === 22) bloco.style.width = "45%";
      tela.appendChild(bloco);
    });
  }

  function falhou(){
    cabecalhoInicio();
    tela.textContent = "";
    var c = el("div", "vazio");
    c.appendChild(icone("i-atencao"));
    c.appendChild(el("b", "", "Não foi possível carregar o cardápio."));
    c.appendChild(el("span", "", "Verifique a conexão e tente de novo. Se você abriu o arquivo " +
      "direto do disco, use um servidor: python -m http.server na pasta demo/."));
    tela.appendChild(c);

    var tentar = el("button", "cta forte");
    tentar.style.marginTop = "16px";
    tentar.appendChild(icone("i-atualizar"));
    tentar.appendChild(el("b", "", "Tentar novamente"));
    tentar.addEventListener("click", carregar);
    tela.appendChild(tentar);
  }

  // ---------- carga ----------
  //
  // Servido por HTTP, o app busca os arquivos. Empacotado numa pagina so — e
  // o que acontece quando ele vira um link para alguem testar —, os mesmos
  // dados ja chegam embutidos em `window.__APETIT__`. Um caminho de codigo,
  // dois jeitos de entregar.
  function carregar(){
    esqueleto();
    var embutido = window.__APETIT__;
    var promessa = embutido
      ? Promise.resolve([embutido.telas, embutido.dados || null])
      : Promise.all([
          fetch("telas.json").then(function(r){
            if (!r.ok) throw new Error("telas");
            return r.json();
          }),
          fetch("dados.json").then(function(r){ return r.json(); }).catch(function(){ return null; })
        ]);

    promessa.then(function(par){
      TELAS = par[0];
      DADOS = par[1];
      estado.pontos = (DADOS && DADOS.progresso && DADOS.progresso.pontos) || 0;
      mostrar("inicio", false);
    }).catch(falhou);
  }

  carregar();

})();

</script>
